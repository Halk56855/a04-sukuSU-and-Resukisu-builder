name: Build Samsung A04 rksu Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt upgrade -y
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev git wget python3 python-is-python3 python3-virtualenv zip tar gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Download and Extract Kernel Source from Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading Kernel.tar.gz from v1.0 release..."
          gh release download v1.0 --repo Halk56855/android_kernel_samsung_a04f -p "Kernel.tar.gz"
          
          echo "Extracting Kernel archive..."
          mkdir -p extracted_kernel
          tar -xzf Kernel.tar.gz -C extracted_kernel
          
          shopt -s dotglob
          if [ "$(ls -A extracted_kernel | wc -l)" -eq 1 ] && [ -d "extracted_kernel/$(ls -A extracted_kernel)" ]; then
            INNER_DIR=$(ls -A extracted_kernel)
            mv extracted_kernel/$INNER_DIR/* ./
            rm -rf extracted_kernel
          else
            mv extracted_kernel/* ./
            rm -rf extracted_kernel
          fi
          rm Kernel.tar.gz
          echo "Kernel source extracted successfully."

      - name: Integrate rksu
        run: |
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Configure Kernel Defconfig
        run: |
          DEFCONFIG_PATH="arch/arm64/configs/a04_defconfig"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "CONFIG_LOCALVERSION=\"-physwizz\"" >> "$DEFCONFIG_PATH"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KPROBES=n" >> "$DEFCONFIG_PATH"
            echo "CONFIG_HAVE_KPROBES=n" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KPROBE_EVENTS=n" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SECURITY_DEFEX=n" >> "$DEFCONFIG_PATH"
            echo "CONFIG_PROCA=n" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KERNEL_GZIP=y" >> "$DEFCONFIG_PATH"
            echo "Defconfig updated successfully."
          else
            echo "Warning: Defconfig path not found, searching..."
            find arch/arm64/configs -name "*defconfig"
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          make clean && make mrproper
          make O=out a04_defconfig
          make -j$(nproc) O=out CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone https://github.com/KernelSU/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git
          
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image anykernel/
          else
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          
          cd anykernel
          zip -r9 ../Samsung-A04-rksu-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A04-rksu-Artifact
          path: Samsung-A04-rksu-Kernel.zip
