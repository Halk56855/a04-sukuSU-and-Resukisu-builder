name: Build Kernel with ReSukiSU & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libglib2.0-dev zip git wget curl

    - name: Download Toolchains
      run: |
        mkdir -p toolchain
        cd toolchain

        # تحميل Clang r383902b المباشر من Google
        mkdir clang
        curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android11-release/clang-r383902b.tar.gz" | tar -xzC clang

        # تحميل GCC AArch64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64

    - name: Fetch Kernel Source
      run: |
        git clone --depth=1 -b latest-B https://github.com/rsuntk-oss/android_kernel_samsung_a04m.git kernel

    - name: Setup ReSukiSU, SUSFS & ReSukiSU Patches
      run: |
        cd kernel

        # 1. إعداد ReSukiSU
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s v4.1.0

        # 2. استبدال وحدة اتصال MediaTek
        rm -rf drivers/misc/mediatek/connectivity
        git clone --depth=1 https://github.com/rsuntkOrgs/mtk_connectivity_module.git drivers/misc/mediatek/connectivity

        # 3. جلب وتطبيق ترقيع ReSukiSU (Manual Hooks)
        git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU_Patches.git resukisu_patches
        patch -p1 < resukisu_patches/scope-minimized/kernel-4.19.patch || true

        # 4. تعطيل Kprobes داخل ReSukiSU/KernelSU لإجبار استخدام الخطاف اليدوي
        KSU_DIR=""
        if [ -d "KernelSU" ]; then KSU_DIR="KernelSU"; elif [ -d "drivers/kernelsu" ]; then KSU_DIR="drivers/kernelsu"; fi
        if [ -n "$KSU_DIR" ]; then
          find "$KSU_DIR" -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} +
        fi

        # 5. جلب مستودع SUSFS (فرع kernel-4.19)
        git clone -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs

        # 6. نسخ ملفات fs و include إلى مسارات النواة
        cp -r susfs/kernel_patches/fs/* fs/
        cp -r susfs/kernel_patches/include/linux/* include/linux/

        # 7. تطبيق ترقيع KernelSU / ReSukiSU الخاص بـ SUSFS
        if [ -n "$KSU_DIR" ]; then
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch "$KSU_DIR"/
          cd "$KSU_DIR" && patch -p1 < 10_enable_susfs_for_ksu.patch || true && cd ..
        fi

        # 8. تطبيق ترقيع النواة الرئيسي لـ SUSFS (50_add_susfs_in_kernel)
        cp susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
        patch -p1 < 50_add_susfs_in_kernel-4.19.patch || true

        # 9. إزالة نص -dirty من إعدادات الإصدار
        sed -i 's/printf "%s" -dirty/printf "%s" ""/g' scripts/setlocalversion || true

        # 10. تفعيل خيارات KSU و SUSFS والخطافات اليدوية في defconfig
        echo "CONFIG_KSU=y" >> arch/arm64/configs/a04m_defconfig
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/a04m_defconfig
        echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/a04m_defconfig
        echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/a04m_defconfig

    - name: Compile Kernel
      run: |
        cd kernel
        export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-

        make O=out a04m_defconfig
        make -j$(nproc) O=out
