name: Build SukiSU-Ultra Kernel for Galaxy A04 (MT 4.19)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Halk56855/android_kernel_samsung_a04m
          ref: latest-B
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3

      - name: Clone Required Toolchains (GCC & Clang)
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain/aarch64-linux-android-4.9
          mkdir -p toolchain/clang/host/linux-x86
          git clone --depth=1 https://github.com/techyminati/android_prebuilts_clang_host_linux-x86_clang-6443078.git toolchain/clang/host/linux-x86/clang-r383902

      - name: Apply MediaTek 4.19 WiFi Fix & Purge Duplicate MTK_CMDQ Definitions
        run: |
          rm -rf drivers/misc/mediatek/connectivity
          git clone https://github.com/rsuntkOrgs/mtk_connectivity_module --depth=1 -b staging-4.19 drivers/misc/mediatek/connectivity
          rm -rf drivers/misc/mediatek/connectivity/.git
          
          python3 -c '
          import glob
          for filepath in glob.glob("drivers/misc/mediatek/connectivity/**/Kconfig*", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              if "config MTK_CMDQ" in content:
                  lines = content.splitlines(keepends=True)
                  new_lines = []
                  i = 0
                  while i < len(lines):
                      if "config MTK_CMDQ" in lines[i]:
                          i += 1
                          while i < len(lines):
                              l = lines[i]
                              s = l.strip()
                              if s.startswith("config ") or s.startswith("menuconfig ") or s.startswith("choice ") or s.startswith("endchoice ") or s.startswith("menu ") or s.startswith("endmenu ") or s.startswith("if ") or s.startswith("endif ") or (l and not l.startswith("\t") and not l.startswith(" ")):
                                  break
                              i += 1
                      else:
                          new_lines.append(lines[i])
                          i += 1
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.writelines(new_lines)
          '

          sed -i 's/PUINT32 pTimeSlot = (PUINT32) &gPwrSeqTime;/\/\/ PUINT32 pTimeSlot = (PUINT32) \&gPwrSeqTime;/g' drivers/misc/mediatek/connectivity/common/common_main/platform/mtk_wcn_cmb_hw.c

      - name: Inject SukiSU-Ultra
        run: |
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/sukisu_repo
          mkdir -p drivers/sukisu
          cp -rf /tmp/sukisu_repo/kernel/* drivers/sukisu/
          
          # سكريبت بايثون آمن ومحصّن ضد أخطاء تكرار المجلدات وتعارض المسارات
          python3 -c '
          import os, glob, shutil

          sukisu_dir = "drivers/sukisu"
          header_files = glob.glob(os.path.join(sukisu_dir, "**/*.h"), recursive=True)
          subdirs = [x[0] for x in os.walk(sukisu_dir)]
          
          for d in subdirs:
              uapi_sub = os.path.join(d, "uapi")
              try:
                  os.makedirs(uapi_sub, exist_ok=True)
              except Exception:
                  pass

              for h in header_files:
                  dest_d = os.path.join(d, os.path.basename(h))
                  dest_uapi = os.path.join(uapi_sub, os.path.basename(h))
                  
                  try:
                      if os.path.abspath(h) != os.path.abspath(dest_d) and not os.path.isdir(dest_d):
                          shutil.copy(h, dest_d)
                  except Exception:
                      pass
                      
                  try:
                      if os.path.abspath(h) != os.path.abspath(dest_uapi) and not os.path.isdir(dest_uapi):
                          shutil.copy(h, dest_uapi)
                  except Exception:
                      pass

          for filepath in glob.glob(os.path.join(sukisu_dir, "**/*"), recursive=True):
              if os.path.isfile(filepath) and filepath.endswith((".h", ".c")):
                  try:
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      new_content = content.replace("#include \"uapi/", "#include \"")
                      if new_content != content:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(new_content)
                  except Exception:
                      pass
          '
          
          if ! grep -q "drivers/sukisu/Kconfig" drivers/Kconfig; then
              echo 'source "drivers/sukisu/Kconfig"' >> drivers/Kconfig
          fi
          
          if ! grep -q "sukisu/" drivers/Makefile; then
              echo 'obj-y += sukisu/' >> drivers/Makefile
          fi

      - name: Configure Kernel Flags & Security Bypasses
        run: |
          DEFCONFIG="a04_defconfig"
          CONFIG_PATH="arch/arm64/configs/$DEFCONFIG"
          
          echo "CONFIG_KSU=y" >> $CONFIG_PATH
          echo "CONFIG_KPM=y" >> $CONFIG_PATH
          echo "CONFIG_KPROBES=y" >> $CONFIG_PATH
          echo "CONFIG_HAVE_KPROBES=y" >> $CONFIG_PATH
          echo "CONFIG_KPROBE_EVENTS=y" >> $CONFIG_PATH
          echo "CONFIG_KALLSYMS=y" >> $CONFIG_PATH
          echo "CONFIG_KALLSYMS_ALL=y" >> $CONFIG_PATH
          
          echo "CONFIG_OVERLAY_FS=y" >> $CONFIG_PATH
          echo "CONFIG_FS_ENCRYPTION=y" >> $CONFIG_PATH
          echo "CONFIG_TMPFS_XATTR=y" >> $CONFIG_PATH
          echo "CONFIG_SECURITY_SELINUX=y" >> $CONFIG_PATH
          
          echo "CONFIG_SECURITY_DEFEX=n" >> $CONFIG_PATH
          echo "CONFIG_PROCA=n" >> $CONFIG_PATH
          echo "CONFIG_UH=n" >> $CONFIG_PATH

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/toolchain/clang/host/linux-x86/clang-r383902/bin:${{ github.workspace }}/toolchain/aarch64-linux-android-4.9/bin:$PATH"
          
          DEFCONFIG="a04_defconfig"
          make O=out $DEFCONFIG
          
          make O=out -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- KCFLAGS="-w" HOSTCFLAGS="-w" || \
          make O=out -j1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- KCFLAGS="-w" HOSTCFLAGS="-w"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git* anykernel/README.md
          
          cp out/arch/arm64/boot/Image anykernel/
          
          cd anykernel
          zip -r ../SukiSU-Ultra-A04-Kernel.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-A04-Kernel
          path: SukiSU-Ultra-A04-Kernel.zip
