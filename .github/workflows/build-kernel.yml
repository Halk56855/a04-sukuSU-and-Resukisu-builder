name: Build SukiSU-Ultra Kernel for Galaxy A04 (MT 4.19)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Halk56855/android_kernel_samsung_a04m
          ref: latest-B
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3

      - name: Clone Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: Apply MediaTek 4.19 WiFi Fix & Purge MTK_CMDQ Conflict
        run: |
          # استبدال مجلد الاتصال بحزمة نواة 4.19
          rm -rf drivers/misc/mediatek/connectivity
          git clone https://github.com/rsuntkOrgs/mtk_connectivity_module --depth=1 -b staging-4.19 drivers/misc/mediatek/connectivity
          rm -rf drivers/misc/mediatek/connectivity/.git
          
          # استخدام بايثون لحذف تعريف MTK_CMDQ المتعارض من وحدة الواي فاي المضافة نهائياً
          python3 -c '
          import glob
          for filepath in glob.glob("drivers/misc/mediatek/connectivity/**/Kconfig*", recursive=True):
              try:
                  with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()
                  new_lines = []
                  skip = False
                  for line in lines:
                      if "config MTK_CMDQ" in line:
                          skip = True
                          continue
                      if skip:
                          if line.strip() == "" or line.startswith("config ") or line.startswith("menuconfig ") or line.startswith("choice "):
                              skip = False
                          else:
                              continue
                      if "MTK_CMDQ" in line:
                          continue
                      new_lines.append(line)
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.writelines(new_lines)
              except Exception as e:
                  print(f"Error processing {filepath}: {e}")
          '

      - name: Inject SukiSU-Ultra
        run: |
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/sukisu_repo
          mkdir -p drivers/sukisu
          cp -rf /tmp/sukisu_repo/kernel/* drivers/sukisu/
          
          if ! grep -q "drivers/sukisu/Kconfig" drivers/Kconfig; then
              echo 'source "drivers/sukisu/Kconfig"' >> drivers/Kconfig
          fi
          
          if ! grep -q "sukisu/" drivers/Makefile; then
              echo 'obj-y += sukisu/' >> drivers/Makefile
          fi

      - name: Configure Kernel Flags & Security Bypasses
        run: |
          DEFCONFIG="a04_defconfig"
          CONFIG_PATH="arch/arm64/configs/$DEFCONFIG"
          
          # خيارات SukiSU-Ultra والخطافات
          echo "CONFIG_KSU=y" >> $CONFIG_PATH
          echo "CONFIG_KPM=y" >> $CONFIG_PATH
          echo "CONFIG_KPROBES=y" >> $CONFIG_PATH
          echo "CONFIG_HAVE_KPROBES=y" >> $CONFIG_PATH
          echo "CONFIG_KPROBE_EVENTS=y" >> $CONFIG_PATH
          echo "CONFIG_KALLSYMS=y" >> $CONFIG_PATH
          echo "CONFIG_KALLSYMS_ALL=y" >> $CONFIG_PATH
          
          # خيارات التوافق للرومات المعدلة ونظام الملفات
          echo "CONFIG_OVERLAY_FS=y" >> $CONFIG_PATH
          echo "CONFIG_FS_ENCRYPTION=y" >> $CONFIG_PATH
          echo "CONFIG_TMPFS_XATTR=y" >> $CONFIG_PATH
          echo "CONFIG_SECURITY_SELINUX=y" >> $CONFIG_PATH
          
          # إيقاف حماية سامسونج المعرقلة للروت
          echo "CONFIG_SECURITY_DEFEX=n" >> $CONFIG_PATH
          echo "CONFIG_PROCA=n" >> $CONFIG_PATH
          echo "CONFIG_UH=n" >> $CONFIG_PATH

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
          
          DEFCONFIG="a04_defconfig"
          make O=out $DEFCONFIG
          make O=out -j$(nproc) CC=gcc

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git* anykernel/README.md
          
          cp out/arch/arm64/boot/Image anykernel/
          
          cd anykernel
          zip -r ../SukiSU-Ultra-A04-Kernel.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-A04-Kernel
          path: SukiSU-Ultra-A04-Kernel.zip
