name: Build Android Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libssl-dev \
            libxml2 libxml2-utils lzop rsync schedtool \
            squashfs-tools xsltproc yasm zlib1g-dev

      - name: Clone Clang Toolchain
        run: |
          mkdir -p toolchain/clang/host/linux-x86
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r383902.git toolchain/clang/host/linux-x86/clang-r383902

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${PWD}/toolchain/clang/host/linux-x86/clang-r383902/bin:${PATH}"
          
          make O=out CC=clang a04_defconfig
          make -j$(nproc) O=out CC=clang
