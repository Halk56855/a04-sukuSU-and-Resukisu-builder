name: Build SukiSU-Ultra KernelPatch for Galaxy A04

on:
  workflow_dispatch: # للبدء اليدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Kernel Source (DaniTheSillyFem/kernel_samsung_a04)
        uses: actions/checkout@v4
        with:
          repository: DaniTheSillyFem/kernel_samsung_a04
          ref: linux-4.19.y

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev lld llvm

      - name: Download Toolchains (GCC for MediaTek Compatibility)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain-gcc64

      - name: Configure and Compile Kernel with GCC
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/toolchain-gcc64/bin:$PATH"
          
          # تنظيف الملفات السابقة بالكامل
          make O=out mrproper || true
          
          # اكتشاف وضبط ملف التهيئة المناسب تلقائياً
          DEFCONFIG=""
          if [ -d "arch/arm64/configs" ]; then
            DEFCONFIG=$(ls arch/arm64/configs/ | grep -E "a04|mtk|6765" | head -n 1)
          fi
          
          if [ -n "$DEFCONFIG" ]; then
            make O=out "$DEFCONFIG"
          else
            make O=out mtk_defconfig || make O=out a04_defconfig || true
          fi
          
          # مزامنة التهيئة تلقائياً
          make O=out olddefconfig || true
          
          # تفعيل المتطلبات الإجبارية لـ SukiSU-Ultra ونواة 4.19
          scripts/config --file out/.config --enable CONFIG_KPM
          scripts/config --file out/.config --enable CONFIG_KALLSYMS
          scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
          
          # تعطيل نظم الملفات المتعارضة لتفادي أخطاء التجميع
          scripts/config --file out/.config --disable CONFIG_SDFAT_FS || true
          scripts/config --file out/.config --disable CONFIG_SDFAT_SUPPORT || true
          
          # مزامنة نهائية لتثبيت الإعدادات
          make O=out olddefconfig
          
          # بدء البناء البرمجي للنواة بتوافق تام مع معالجات MediaTek
          make O=out -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- KCFLAGS="-w"

      - name: Apply SukiSU KernelPatch (KPM)
        run: |
          wget https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/v0.13.0/kptools-linux
          wget https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/v0.13.0/kpimg
          chmod +x kptools-linux
          
          KERNEL_IMAGE="out/arch/arm64/boot/Image"
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz"
          fi
          
          # حقن ورقع النواة بأدوات SukiSU-Ultra الأصلية
          ./kptools-linux -p -i "$KERNEL_IMAGE" -k kpimg -o patched_image

      - name: Pack with AnyKernel3
        run: |
          git clone https://github.com/Kernel-SU/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git
          
          if [ -f "patched_image" ]; then
            cp patched_image anykernel/Image
          else
            cp out/arch/arm64/boot/Image anykernel/Image
          fi
          
          cd anykernel
          zip -r ../SukiSU-Ultra-KernelPatch-A04.zip *

      - name: Upload Built Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-KernelPatch-A04
          path: SukiSU-Ultra-KernelPatch-A04.zip
