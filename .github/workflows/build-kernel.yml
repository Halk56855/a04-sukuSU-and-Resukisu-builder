name: Build Samsung A04m Stable rksu Kernel with StatiXOS Clang & LTO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    container: debian:13
    steps:
      - name: Checkout Kernel Source (latest-B Branch)
        uses: actions/checkout@v4
        with:
          repository: 'rsuntk-oss/android_kernel_samsung_a04m'
          ref: 'latest-B'

      - name: Setup Build Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt update
          apt install -y build-essential bc bison flex libssl-dev libelf-dev git wget python3 python3-pip curl zip tar dos2unix gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup StatiXOS Clang Toolchain & Fix Path Mismatch
        run: |
          echo "Setting up StatiXOS Clang toolchain..."
          mkdir -p toolchain/clang/host/linux-x86
          
          git clone --depth=1 https://github.com/StatiXOS/android_prebuilts_clang_host_linux-x86.git toolchain/clang/host/linux-x86/statix-repo
          
          if [ -d "toolchain/clang/host/linux-x86/statix-repo/clang-r416183c" ]; then
            mv toolchain/clang/host/linux-x86/statix-repo/clang-r416183c toolchain/clang/host/linux-x86/
            rm -rf toolchain/clang/host/linux-x86/statix-repo
            
            # إنشاء رابط رمزي لتوثيق مسار clang-r383902 الذي تطلبه النواة داخلياً
            cd toolchain/clang/host/linux-x86/
            ln -s clang-r416183c clang-r383902
            cd ../../../
            echo "Clang toolchain and symlink setup successfully."
          else
            echo "Error: Failed to find clang-r416183c!"
            exit 1
          fi

      - name: Integrate Stable rksu (v3.0.0-30-legacy)
        run: |
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s v3.0.0-30-legacy

      - name: Reset Drivers and Fix All Kconfig Choice Mismatches
        run: |
          echo "Resetting drivers and cleaning line endings..."
          git checkout drivers/ || true
          find . -name "Kconfig*" -type f -exec dos2unix {} + || true
          find . -name "Kconfig" -type f -exec dos2unix {} + || true

          # تنظيف الرموز الزائدة لمنع أخطاء التوافق
          find drivers/ -name "Kconfig*" -type f -exec sed -i 's/+//g' {} + || true
          
          if [ -f "drivers/soc/mediatek/Kconfig" ]; then
            sed -i '/config MTK_CMDQ/,/^$/ s/tristate/bool/g' drivers/soc/mediatek/Kconfig || true
            sed -i 's/tristate "MediaTek Command Queue"/bool "MediaTek Command Queue"/' drivers/soc/mediatek/Kconfig || true
          fi

          if [ -f "drivers/misc/mediatek/base/power/Kconfig" ]; then
            sed -i 's/tristate "MTK QOS Framework"/bool "MTK QOS Framework"/' drivers/misc/mediatek/base/power/Kconfig || true
          fi

          # سكريبت بايثون شامل لمعالجة خطأ choice default symbol غير المتطابق في درايفرات اللمس وغيرها دون حذف أي درايفر
          python3 -c '
          import glob
          paths = glob.glob("drivers/**/Kconfig", recursive=True) + ["Kconfig", "init/Kconfig"]
          for path in set(paths):
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()
                  new_lines = []
                  modified = False
                  for i, line in enumerate(lines):
                      stripped = line.strip()
                      # إصلاح مشاكل الـ default symbol المعطوبة أو اختيار خارج المجموعة
                      if "TOUCHSCREEN_HIMAX_INCELL" in stripped and "default" in stripped:
                          new_lines.append("# " + line.strip() + " # Fixed choice default mismatch\n")
                          modified = True
                          continue
                      if "default symbol" in stripped or (path == "init/Kconfig" and i in [15, 16, 17]):
                          new_lines.append("# " + line.strip() + " # Fixed safe syntax/default mismatch\n")
                          modified = True
                          continue
                      new_lines.append(line)
                  if modified:
                      with open(path, "w", encoding="utf-8") as f:
                          f.writelines(new_lines)
              except Exception as e:
                  print(f"Safe skip for {path}: {e}")
          '
          echo "Kconfig files cleaned and fixed successfully."

      - name: Configure Kernel Defconfig with Options
        run: |
          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*defconfig" | head -n 1)
          echo "Using defconfig: $DEFCONFIG_FILE"
          
          if [ -f "$DEFCONFIG_FILE" ]; then
            echo "CONFIG_LOCALVERSION=\"-physwizz\"" >> "$DEFCONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KPROBES=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_HAVE_KPROBES=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KPROBE_EVENTS=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_SECURITY_DEFEX=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_PROCA=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KERNEL_GZIP=y" >> "$DEFCONFIG_FILE"
            
            echo "DEFCONFIG_NAME=$(basename $DEFCONFIG_FILE)" >> $GITHUB_ENV
          else
            echo "Error: Defconfig not found!"
            exit 1
          fi

      - name: Build Kernel with StatiXOS Clang & LTO Support
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # توجيه مسار أداة Clang لتشمل المسار الرئيسي والرابط الرمزي
          export PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r416183c/bin:$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin:$PATH"
          
          make clean && make mrproper
          make O=out {{ env.DEFCONFIG_NAME }}
          
          # تشغيل أمر olddefconfig بشكل سليم بعد تنظيف أخطاء Kconfig لمنع فشل syncconfig
          make O=out olddefconfig
          
          # بناء النواة بالكامل
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone https://github.com/KernelSU/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git
          
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image anykernel/
          else
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          
          cd anykernel
          zip -r9 ../Samsung-A04m-Stable-rksu-StatiXOSClang-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A04m-Stable-rksu-StatiXOSClang-Artifact
          path: Samsung-A04m-Stable-rksu-StatiXOSClang-Kernel.zip
