name: Build SukiSU-Ultra for Galaxy A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Halk56855/android_kernel_samsung_a04m
          ref: latest-B
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev

      - name: Clone Toolchain (GCC/Clang)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: Inject SukiSU-Ultra & Configure Drivers
        run: |
          # إنشاء مجلد sukisu ودمج الملفات
          mkdir -p drivers/sukisu
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git drivers/sukisu/
          
          # ربط السورس بنظام بناء النواة
          echo 'source "drivers/sukisu/Kconfig"' >> drivers/Kconfig
          echo 'obj-y += sukisu/' >> drivers/Makefile

      - name: Configure Kernel Flags (Defconfig)
        run: |
          # استبدل a04_defconfig باسم ملف التكوين الفعلي الموجود في arch/arm64/configs/ لجهازك
          DEFCONFIG="a04_defconfig"
          
          echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/$DEFCONFIG

      - name: Start Kernel Compilation
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
          
          DEFCONFIG="a04_defconfig"
          make O=out $DEFCONFIG
          make O=out -j$(nproc) CC=gcc

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git* anykernel/README.md
          
          # نسخ النواة الناتجة (تأكد من مسار ملف Image حسب مخرجات جهازك)
          cp out/arch/arm64/boot/Image anykernel/
          
          cd anykernel
          zip -r ../SukiSU-Ultra-A04-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-A04-Kernel
          path: SukiSU-Ultra-A04-Kernel.zip
