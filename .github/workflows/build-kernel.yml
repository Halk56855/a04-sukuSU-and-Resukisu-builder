name: Build SukiSU Kernel for Samsung A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            wget \
            python3 \
            zip

      - name: Setup Toolchain (Clang/GCC)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain-gcc
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b.git toolchain-clang

      - name: Integrate SukiSU
        run: |
          # يمكنك اختيار إما الفرع المدمج أو فرع LKM بناءً على متطلباتك:
          
          # استخدام الفرع المدمج (Builtin Branch):
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          
          # أو استخدام فرع LKM (Main Branch):
          # curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

          # تعديل إعدادات النواة المطلوبة للأجهزة التي لا تدعم GKI
          DEFCONFIG_PATH="arch/arm64/configs/a04_defconfig"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KPM=y" >> "$DEFCONFIG_PATH"
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/toolchain-clang/bin:$PWD/toolchain-gcc/bin:$PATH"
          
          make O=out a04_defconfig
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-android-

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone https://github.com/KernelSU/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git
          cp out/arch/arm64/boot/Image.gz anykernel/
          cd anykernel
          zip -r9 ../SukiSU-Samsung-A04.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Samsung-A04-Kernel
          path: SukiSU-Samsung-A04.zip
