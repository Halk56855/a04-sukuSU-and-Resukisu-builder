name: Build Kernel with ReSukiSU & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libglib2.0-dev zip git wget

    - name: Download Toolchains
      run: |
        mkdir -p toolchain
        cd toolchain
        # Clang r383902b
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r383902b.tar.gz
        mkdir clang && tar -xf clang-r383902b.tar.gz -C clang
        # GCC AArch64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64

    - name: Fetch Kernel Source
      run: |
        git clone --depth=1 -b latest-B https://github.com/rsuntk-oss/android_kernel_samsung_a04m.git kernel

    - name: Setup ReSukiSU & SUSFS
      run: |
        cd kernel
        # Setup ReSukiSU v4.1.0
        curl -LSs "https://raw.githubusercontent.com/rsuntkOrgs/ReSukiSU/main/kernel/setup.sh" | bash -s v4.1.0

        # Clone SUSFS Patches
        git clone https://gitlab.com/simonpunk/susfs4ksu.git
        cp susfs4ksu/kernel-4.19/patches/50_add_susfs_in_kernel-4.19.patch .

        # Apply Patch (Ignores errors to handle sched.h manually if needed)
        patch -p1 < 50_add_susfs_in_kernel-4.19.patch || true

    - name: Compile Kernel
      run: |
        cd kernel
        export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-

        make O=out a04m_defconfig
        make -j$(nproc) O=out
