name: Build SukiSU Kernel for Samsung A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            wget \
            python3 \
            zip \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Integrate SukiSU (Main Branch - LKM)
        run: |
          # استخدام فرع النظام الرئيسي (LKM) كما طلبت
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

          # تعديل إعدادات النواة المطلوبة للأجهزة التي لا تدعم GKI
          DEFCONFIG_PATH="arch/arm64/configs/a04_defconfig"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KPM=y" >> "$DEFCONFIG_PATH"
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out a04_defconfig
          make -j$(nproc) O=out CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone https://github.com/KernelSU/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git
          cp out/arch/arm64/boot/Image.gz anykernel/
          cd anykernel
          zip -r9 ../SukiSU-Samsung-A04.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Samsung-A04-Kernel
          path: SukiSU-Samsung-A04.zip
