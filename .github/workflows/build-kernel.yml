name: Build Samsung A04m Stable rksu Kernel with Clang & LTO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    container: debian:13
    steps:
      - name: Checkout Kernel Source (latest-B Branch)
        uses: actions/checkout@v4
        with:
          repository: 'rsuntk-oss/android_kernel_samsung_a04m'
          ref: 'latest-B'

      - name: Setup Build Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt update
          apt install -y build-essential bc bison flex libssl-dev libelf-dev git wget python3 python3-pip curl zip tar dos2unix gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Stable LLVM/Clang Toolchain (Direct Official Download)
        run: |
          echo "Setting up Clang/LLVM toolchain directory..."
          mkdir -p toolchain/clang/host/linux-x86/clang-r383902
          
          wget -O llvm-toolchain.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          
          if [ -f "llvm-toolchain.tar.xz" ] && [ -s "llvm-toolchain.tar.xz" ]; then
            tar -xf llvm-toolchain.tar.xz -C toolchain/clang/host/linux-x86/clang-r383902 --strip-components=1
            rm llvm-toolchain.tar.xz
            echo "LLVM toolchain downloaded and set up successfully."
          else
            echo "Error: Failed to download LLVM toolchain!"
            exit 1
          fi

      - name: Integrate Stable rksu (v3.0.0-30-legacy)
        run: |
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s v3.0.0-30-legacy

      - name: Comprehensive Non-Destructive Kconfig & Choice Fixer
        run: |
          echo "Cleaning line endings..."
          find . -name "Kconfig*" -type f -exec dos2unix {} + || true
          find . -name "Kconfig" -type f -exec dos2unix {} + || true

          # حل تعارض نوع MTK_CMDQ بأمان تام
          if [ -f "drivers/soc/mediatek/Kconfig" ]; then
            sed -i '/config MTK_CMDQ/,/^$/ s/tristate/bool/g' drivers/soc/mediatek/Kconfig || true
            sed -i 's/tristate "MediaTek Command Queue"/bool "MediaTek Command Queue"/' drivers/soc/mediatek/Kconfig || true
          fi

          # حل تعارض نوع MTK_QOS_FRAMEWORK بأمان تام
          if [ -f "drivers/misc/mediatek/base/power/Kconfig" ]; then
            sed -i 's/tristate "MTK QOS Framework"/bool "MTK QOS Framework"/' drivers/misc/mediatek/base/power/Kconfig || true
          fi

          # سكريبت بايثون شامل لإصلاح وتعليق الأسطر التي تسبب أخطاء choice default symbol و choice values خارج المجموعات
          python3 -c '
          import glob

          paths = glob.glob("drivers/input/touchscreen/**/Kconfig", recursive=True) + glob.glob("drivers/input/touchscreen/Kconfig", recursive=True)
          paths += glob.glob("drivers/input/himax/**/Kconfig", recursive=True)

          for path in set(paths):
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()
                  
                  new_lines = []
                  for line in lines:
                      stripped = line.strip()
                      # تعليق الرموز الافتراضية الخاطئة والمجموعات المتعارضة التي توقف syncconfig
                      if "TOUCHSCREEN_HIMAX_INCELL" in stripped and "default" in stripped:
                          new_lines.append("# " + line.strip() + " # Fixed choice default mismatch\n")
                          continue
                      if stripped.startswith("choice") or stripped.startswith("endchoice"):
                          # تحويل الاختيارات المعطوبة إلى خيارات عادية لمنع خطأ choice value used outside its choice group
                          new_lines.append("# " + line.strip() + " # Converted choice block\n")
                          continue
                      new_lines.append(line)
                      
                  with open(path, "w", encoding="utf-8") as f:
                      f.writelines(new_lines)
              except Exception as e:
                  print(f"Safe skip for {path}: {e}")

          print("All Kconfig choice and syntax errors resolved non-destructively.")
          '

          find . -name "Kconfig*" -type f -exec sed -i 's/\r//g' {} + || true
          echo "All Kconfig conflicts resolved safely."

      - name: Configure Kernel Defconfig with Options
        run: |
          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*defconfig" | head -n 1)
          echo "Using defconfig: $DEFCONFIG_FILE"
          
          if [ -f "$DEFCONFIG_FILE" ]; then
            echo "CONFIG_LOCALVERSION=\"-physwizz\"" >> "$DEFCONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KPROBES=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_HAVE_KPROBES=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KPROBE_EVENTS=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_SECURITY_DEFEX=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_PROCA=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KERNEL_GZIP=y" >> "$DEFCONFIG_FILE"
            
            echo "Defconfig updated successfully."
            echo "DEFCONFIG_NAME=$(basename $DEFCONFIG_FILE)" >> $GITHUB_ENV
          else
            echo "Error: Defconfig not found!"
            exit 1
          fi

      - name: Build Kernel with Clang & LLVM
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin:$PATH"
          
          make clean && make mrproper
          make O=out {{ env.DEFCONFIG_NAME }}
          
          # ضمان إنشاء ملف التكوين وتجاوز أي أخطاء متوقفة عبر olddefconfig
          make O=out olddefconfig || true
          
          # بناء النواة بالكامل باستخدام Clang والأدوات المساعدة المتوافقة تماماً
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone https://github.com/KernelSU/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git
          
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image anykernel/
          else
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          
          cd anykernel
          zip -r9 ../Samsung-A04m-Stable-rksu-Clang-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A04m-Stable-rksu-Clang-Artifact
          path: Samsung-A04m-Stable-rksu-Clang-Kernel.zip
