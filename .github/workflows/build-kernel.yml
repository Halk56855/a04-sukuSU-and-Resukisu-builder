name: Build SukiSU-Ultra Kernel for Samsung A04

on:
  workflow_dispatch: # يتيح تشغيل البناء يدوياً من تبويب Actions في قيت هب

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository / Setup Environment
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git libssl-dev libncurses5-dev python3 zlib1g-dev libelf-dev

      - name: Clone Samsung A04 Kernel Source
        run: |
          git clone -b latest-B https://github.com/rsuntk-oss/android_kernel_samsung_a04m.git kernel-source

      - name: Setup SukiSU-Ultra (Built-in)
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Configure Kernel with a04_defconfig
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          # يمكنك استخدام مسار المترجم (Toolchain) الخاص بك هنا إذا لزم الأمر
          make O=out a04_defconfig

      - name: Compile Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          # بدء عملية البناء باستخدام كافة أنوية المعالج المتاحة
          make O=out -j$(nproc)
