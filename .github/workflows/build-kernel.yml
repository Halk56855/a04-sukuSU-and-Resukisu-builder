name: Build ReSukiSU Kernel for Samsung A04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Build Environment & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            wget \
            python3 \
            zip \
            tar \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Download and Extract Kernel.tar.gz from v1.0 Release
        run: |
          echo "Downloading Kernel.tar.gz from v1.0 release..."
          wget -O Kernel.tar.gz "https://github.com/Halk56855/android_kernel_samsung_a04f/releases/download/v1.0/Kernel.tar.gz"
          
          echo "Extracting Kernel source files..."
          mkdir -p extracted_kernel
          tar -xzf Kernel.tar.gz -C extracted_kernel
          
          # نقل الملفات إلى المجلد الرئيسي لجذر المستودع (Workspace)
          shopt -s dotglob
          if [ "$(ls -A extracted_kernel | wc -l)" -eq 1 ] && [ -d "extracted_kernel/$(ls -A extracted_kernel)" ]; then
            INNER_DIR=$(ls -A extracted_kernel)
            mv extracted_kernel/$INNER_DIR/* ./
            rm -rf extracted_kernel
          else
            mv extracted_kernel/* ./
            rm -rf extracted_kernel
          fi
          rm Kernel.tar.gz
          echo "Kernel source extracted successfully!"

      - name: Integrate ReSukiSU
        run: |
          # تشغيل سكربت دمج ReSukiSU
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash || true

          # إضافة إعدادات النواة المطلوبة والخطافات اليدوية
          DEFCONFIG_PATH="arch/arm64/configs/a04_defconfig"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KPM=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG_PATH"
            echo "Defconfig updated successfully."
          else
            echo "Warning: a04_defconfig path might differ. Please check your arch/arm64/configs/ directory."
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out a04_defconfig
          make -j$(nproc) O=out CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone https://github.com/KernelSU/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git
          
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image anykernel/
          else
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          
          cd anykernel
          zip -r9 ../ReSukiSU-Samsung-A04.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Samsung-A04-Kernel
          path: ReSukiSU-Samsung-A04.zip
