name: Build Samsung A04m Stable rksu Kernel with GitGud Clang & LTO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    container: debian:13
    steps:
      - name: Checkout Kernel Source (latest-B Branch)
        uses: actions/checkout@v4
        with:
          repository: 'rsuntk-oss/android_kernel_samsung_a04m'
          ref: 'latest-B'

      - name: Setup Build Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt update
          apt install -y build-essential bc bison flex libssl-dev libelf-dev git wget python3 python3-pip curl zip tar dos2unix gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Clang Toolchain from GitGud
        run: |
          echo "Setting up Clang toolchain from GitGud repository..."
          mkdir -p toolchain/clang/host/linux-x86/clang-r596125
          
          git clone https://gitgud.io/aosp/toolchain/llvm-project.git toolchain/clang-llvm-src
          
          # نقل محتويات المستودع أو ضبط المسار بالشكل المتوافق مع مسارات البناء
          if [ -d "toolchain/clang-llvm-src" ]; then
            rm -rf toolchain/clang/host/linux-x86/clang-r596125
            mv toolchain/clang-llvm-src toolchain/clang/host/linux-x86/clang-r596125
            echo "Clang toolchain from GitGud set up successfully."
          else
            echo "Error: Failed to clone Clang toolchain from GitGud!"
            exit 1
          fi

      - name: Integrate Stable rksu (v3.0.0-30-legacy)
        run: |
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s v3.0.0-30-legacy

      - name: Reset Drivers and Safe Kconfig Fixer
        run: |
          echo "Resetting all drivers and Kconfig files to pristine state..."
          git checkout drivers/ || true
          
          echo "Cleaning line endings..."
          find . -name "Kconfig*" -type f -exec dos2unix {} + || true
          find . -name "Kconfig" -type f -exec dos2unix {} + || true

          if [ -f "drivers/soc/mediatek/Kconfig" ]; then
            sed -i '/config MTK_CMDQ/,/^$/ s/tristate/bool/g' drivers/soc/mediatek/Kconfig || true
            sed -i 's/tristate "MediaTek Command Queue"/bool "MediaTek Command Queue"/' drivers/soc/mediatek/Kconfig || true
          fi

          if [ -f "drivers/misc/mediatek/base/power/Kconfig" ]; then
            sed -i 's/tristate "MTK QOS Framework"/bool "MTK QOS Framework"/' drivers/misc/mediatek/base/power/Kconfig || true
          fi

          python3 -c '
          import glob

          paths = glob.glob("drivers/**/Kconfig", recursive=True) + ["Kconfig"]

          for path in set(paths):
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()
                  
                  new_lines = []
                  modified = False
                  for line in lines:
                      stripped = line.strip()
                      if "default symbol" in stripped or ("TOUCHSCREEN_HIMAX_INCELL" in stripped and "default" in stripped):
                          new_lines.append("# " + line.strip() + " # Fixed safe default mismatch\n")
                          modified = True
                          continue
                      new_lines.append(line)
                      
                  if modified:
                      with open(path, "w", encoding="utf-8") as f:
                          f.writelines(new_lines)
              except Exception as e:
                  print(f"Safe skip for {path}: {e}")

          print("Kconfig files cleaned and fixed safely without syntax corruption.")
          '

          find . -name "Kconfig*" -type f -exec sed -i 's/\r//g' {} + || true
          echo "All Kconfig conflicts resolved safely."

      - name: Configure Kernel Defconfig with Options
        run: |
          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*defconfig" | head -n 1)
          echo "Using defconfig: $DEFCONFIG_FILE"
          
          if [ -f "$DEFCONFIG_FILE" ]; then
            echo "CONFIG_LOCALVERSION=\"-physwizz\"" >> "$DEFCONFIG_FILE"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KPROBES=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_HAVE_KPROBES=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KPROBE_EVENTS=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_SECURITY_DEFEX=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_PROCA=n" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KERNEL_GZIP=y" >> "$DEFCONFIG_FILE"
            
            echo "Defconfig updated successfully."
            echo "DEFCONFIG_NAME=$(basename $DEFCONFIG_FILE)" >> $GITHUB_ENV
          else
            echo "Error: Defconfig not found!"
            exit 1
          fi

      - name: Build Kernel with GitGud Clang Toolchain
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # التحقق من مسار الـ bin ضمن أداة Clang المستنسخة
          if [ -d "$(pwd)/toolchain/clang/host/linux-x86/clang-r596125/bin" ]; then
            export PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r596125/bin:$PATH"
          else
            # البحث التلقائي عن مجلد الـ bin إذا كان متداخلًا
            FOUND_BIN=$(find "$(pwd)/toolchain/clang/host/linux-x86/clang-r596125" -type d -name "bin" | head -n 1)
            if [ -n "$FOUND_BIN" ]; then
              export PATH="$(dirname "$FOUND_BIN"):$PATH"
            else
              echo "Error: Clang bin directory not found!"
              exit 1
            fi
          fi
          
          make clean && make mrproper
          make O=out {{ env.DEFCONFIG_NAME }}
          
          make O=out olddefconfig
          
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone https://github.com/KernelSU/AnyKernel3 -b master anykernel
          rm -rf anykernel/.git
          
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image anykernel/
          else
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          
          cd anykernel
          zip -r9 ../Samsung-A04m-Stable-rksu-GitGudClang-Kernel.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A04m-Stable-rksu-GitGudClang-Artifact
          path: Samsung-A04m-Stable-rksu-GitGudClang-Kernel.zip
