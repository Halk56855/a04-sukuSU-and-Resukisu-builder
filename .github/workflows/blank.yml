name: Build Samsung A04 Kernel (rsuntk-oss)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex bison build-essential libssl-dev libncurses5-dev libncursesw5-dev libelf-dev bc u-boot-tools zip unzip liblz4-tool python3

      - name: Clone Samsung A04 Kernel Source (latest-B Branch)
        run: |
          git clone --depth=1 -b latest-B https://github.com/rsuntk-oss/android_kernel_samsung_a04m.git kernel-source

      - name: Download Toolchain (AOSP Clang)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz
          tar -xzf clang-r416183b.tar.gz
          rm clang-r416183b.tar.gz

      - name: Integrate KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Build Kernel Image
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang

          # البحث والتطبيق التلقائي لملف الـ defconfig الخاص بـ A04
          make O=out a04m_defconfig || make O=out a04_defconfig || make O=out a04m_eur_open_defconfig
          make -j$(nproc) O=out

      - name: Pack with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cd AnyKernel3
          
          # نسخ ملف النواة المجمع
          if [ -f ../kernel-source/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.gz .
          elif [ -f ../kernel-source/out/arch/arm64/boot/Image ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image .
          fi

          zip -r9 ../KernelSU-Next-A04M.zip * -x .git README.md

      - name: Upload Kernel ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Samsung-A04M
          path: KernelSU-Next-A04M.zip
