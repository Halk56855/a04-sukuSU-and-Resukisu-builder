name: Build Samsung A04 Kernel with ReSukiSU + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev git clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl cpio python3 zip patch

      - name: Download and Extract Kernel Source
        run: |
          curl -L -o Kernel.tar.gz "https://github.com/Halk56855/android_kernel_samsung_a04f/releases/download/V1.0/Kernel.tar.gz"
          tar -xvf Kernel.tar.gz
          chmod -R +w .

      - name: Setup Toolchains
        run: |
          # 64-bit GCC Toolchain
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc64
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> $GITHUB_PATH

          # 32-bit GCC Toolchain
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc32
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> $GITHUB_PATH

          # Clang Toolchain
          mkdir -p toolchain/clang/host/linux-x86
          git clone https://github.com/kdrag0n/proton-clang.git toolchain/clang/host/linux-x86/clang-r383902 --depth=1

          rm -f toolchain/clang/host/linux-x86/clang-r383902/bin/ld
          rm -f toolchain/clang/host/linux-x86/clang-r383902/bin/ld.lld

          echo "$GITHUB_WORKSPACE/toolchain/clang/host/linux-x86/clang-r383902/bin" >> $GITHUB_PATH

      - name: Integrate ReSukiSU & SUSFS Patches
        run: |
          # 1. دمج ReSukiSU
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

          # 2. جلب رقع SUSFS لنواة kernel 4.19
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 --depth=1 susfs_src

          # نسخ ملفات SUSFS الأساسية إلى النواة
          cp susfs_src/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || true
          cp susfs_src/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || true
          cp susfs_src/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true

          # إضافة susfs.o إلى fs/Makefile إذا لم يكن موجوداً
          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
          fi

          # تطبيق رقع SUSFS
          patch -p1 < susfs_src/kernel_patches/KernelSU/1001-kernel-4.19-add-susfs-to-ksu.patch 2>/dev/null || true
          patch -p1 < susfs_src/kernel_patches/50_add_susfs_in_kernel-4.19.patch 2>/dev/null || true

          # --- إصلاحات خطأ fs/proc/task_mmu.c ---
          if [ -f "include/linux/fs.h" ]; then
            if ! grep -q "INODE_STATE_SUS_KSTAT" include/linux/fs.h; then
              echo -e "\n#ifndef INODE_STATE_SUS_KSTAT\n#define INODE_STATE_SUS_KSTAT (1 << 27)\n#endif" >> include/linux/fs.h
            fi
          fi

          if [ -f "fs/proc/task_mmu.c" ]; then
            sed -i '1i#ifndef INODE_STATE_SUS_KSTAT\n#define INODE_STATE_SUS_KSTAT (1 << 27)\n#endif' fs/proc/task_mmu.c
          fi

          # --- إصلاحات خطأ fs/namespace.c و task_struct ---
          if [ -f "include/linux/sched.h" ]; then
            if ! grep -q "susfs_last_fake_mnt_id" include/linux/sched.h; then
              sed -i '/struct task_struct {/a \	u64 susfs_last_fake_mnt_id;' include/linux/sched.h
            fi
          fi

          if [ -f "fs/namespace.c" ]; then
            sed -i '1i#include <linux/susfs.h>' fs/namespace.c
            sed -i '1i#ifndef CL_COPY_MNT_NS\n#define CL_COPY_MNT_NS 0x20\n#endif' fs/namespace.c
            sed -i '1i#ifndef CL_ZYGOTE_COPY_MNT_NS\n#define CL_ZYGOTE_COPY_MNT_NS 0x40\n#endif' fs/namespace.c
            if ! grep -q "DEFINE_IDA(susfs_mnt_id_ida)" fs/namespace.c; then
              sed -i '1i#include <linux/idr.h>\nDEFINE_IDA(susfs_mnt_id_ida);\nDEFINE_IDA(susfs_mnt_group_ida);' fs/namespace.c
            fi
          fi

          if [ -f "include/linux/mount.h" ]; then
            echo -e "\n#ifndef CL_COPY_MNT_NS\n#define CL_COPY_MNT_NS 0x20\n#endif\n#ifndef CL_ZYGOTE_COPY_MNT_NS\n#define CL_ZYGOTE_COPY_MNT_NS 0x40\n#endif" >> include/linux/mount.h
          fi

          # تجاوز وتفريغ كافة سكريبتات فحص الهُوك
          find . -name "*hook_check.mk" -type f -exec sh -c 'echo "all:" > "$1"' _ {} \;
          sed -i 's/$(error/# $(error/g' drivers/kernelsu/Kbuild 2>/dev/null || true
          sed -i 's/$(error/# $(error/g' KernelSU/Kbuild 2>/dev/null || true

          # حقن تعريف fallthrough
          if [ -f "include/linux/compiler_types.h" ]; then
            echo -e "\n#ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif" >> include/linux/compiler_types.h
          elif [ -f "include/linux/compiler.h" ]; then
            echo -e "\n#ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif" >> include/linux/compiler.h
          fi

          # وصلة رمزية لمجلد SELinux
          mkdir -p security/selinux
          if [ ! -d "security/selinux/ss" ]; then
            ln -sf . security/selinux/ss
          fi

          # حقن التعريفات الثابتة
          find drivers/kernelsu/ KernelSU/ -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null -exec sed -i '1i#undef LINUX_VERSION_CODE\n#define LINUX_VERSION_CODE 267333\n#ifndef KERNEL_VERSION\n#define KERNEL_VERSION(a,b,c) (((a) << 16) + ((b) << 8) + (c))\n#endif\n#ifndef KSU_VERSION\n#define KSU_VERSION 16\n#endif\n#ifndef KSU_VERSION_FULL\n#define KSU_VERSION_FULL "1.0.0"\n#endif\n#ifndef KSU_VERSION_CODE\n#define KSU_VERSION_CODE 10000\n#endif\n#ifndef KSU_VERSION_NAME\n#define KSU_VERSION_NAME "1.0.0"\n#endif\n#ifndef KSU_INVALID_APPID\n#define KSU_INVALID_APPID -1\n#endif\n#ifndef PER_USER_RANGE\n#define PER_USER_RANGE 100000\n#endif\n#ifndef KSU_MAX_PACKAGE_NAME\n#define KSU_MAX_PACKAGE_NAME 256\n#endif' {} + || true

          # سكريبت Python لإصلاح التوافقية وحقن الهُوك والتعريفات الناقصة
          cat << 'EOF' > patch_ksu.py
          import os
          import re

          # 0. إضافة تعريفات CMD_SUSFS الناقصة تلقائياً في susfs.h و susfs_def.h و dispatch.c
          susfs_cmd_defs = """
          #ifndef CMD_SUSFS_ADD_SUS_PATH_LOOP
          #define CMD_SUSFS_ADD_SUS_PATH_LOOP 0x55501
          #endif
          #ifndef CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS
          #define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS 0x55502
          #endif
          #ifndef CMD_SUSFS_ADD_SUS_MAP
          #define CMD_SUSFS_ADD_SUS_MAP 0x55503
          #endif
          #ifndef CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING
          #define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING 0x55504
          #endif
          """

          for h_file in ["include/linux/susfs.h", "include/linux/susfs_def.h"]:
              if os.path.exists(h_file):
                  with open(h_file, "a") as f:
                      f.write(susfs_cmd_defs)

          dispatch_path = "drivers/kernelsu/supercall/dispatch.c"
          if os.path.exists(dispatch_path):
              with open(dispatch_path, "r") as f:
                  d_code = f.read()
              if "CMD_SUSFS_ADD_SUS_PATH_LOOP" not in d_code or "#include <linux/susfs.h>" not in d_code:
                  d_code = "#include <linux/types.h>\n#include <linux/susfs.h>\n#include <linux/susfs_def.h>\n" + susfs_cmd_defs + d_code
                  with open(dispatch_path, "w") as f:
                      f.write(d_code)

          # 1. حقن ksu_handle_execveat في fs/exec.c
          exec_path = "fs/exec.c"
          if os.path.exists(exec_path):
              with open(exec_path, "r") as f:
                  exec_c = f.read()
              
              if "ksu_handle_execveat" not in exec_c:
                  if "<linux/types.h>" not in exec_c:
                      exec_c = "#include <linux/types.h>\n" + exec_c

                  decl = "\n#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, struct user_arg_ptr *argv, struct user_arg_ptr *envp, int *flags);\n#endif\n"
                  hook_str = "\n#ifdef CONFIG_KSU\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n#endif\n"
                  
                  if "do_execveat_common" in exec_c:
                      exec_c = exec_c.replace("static int do_execveat_common", decl + "static int do_execveat_common", 1)
                      exec_c = re.sub(r"(static\s+int\s+do_execveat_common\s*\([^)]*\)\s*\{)", r"\1" + hook_str, exec_c, count=1)
                  elif "do_execveat" in exec_c:
                      exec_c = exec_c.replace("int do_execveat", decl + "int do_execveat", 1)
                      exec_c = re.sub(r"(int\s+do_execveat\s*\([^)]*\)\s*\{)", r"\1" + hook_str, exec_c, count=1)
                  elif "__do_execveat_file" in exec_c:
                      exec_c = exec_c.replace("static int __do_execveat_file", decl + "static int __do_execveat_file", 1)
                      exec_c = re.sub(r"(static\s+int\s+__do_execveat_file\s*\([^)]*\)\s*\{)", r"\1" + hook_str, exec_c, count=1)
                      
                  with open(exec_path, "w") as f:
                      f.write(exec_c)

          # 2. حقن ksu_handle_setresuid في kernel/sys.c
          sys_path = "kernel/sys.c"
          if os.path.exists(sys_path):
              with open(sys_path, "r") as f:
                  sys_c = f.read()

              if "ksu_handle_setresuid" not in sys_c:
                  if "<linux/types.h>" not in sys_c:
                      sys_c = "#include <linux/types.h>\n" + sys_c

                  decl = "\n#ifdef CONFIG_KSU\nextern int ksu_handle_setresuid(uid_t *ruid, uid_t *euid, uid_t *suid);\n#endif\n"
                  hook_str = "\n#ifdef CONFIG_KSU\n\tksu_handle_setresuid(&ruid, &euid, &suid);\n#endif\n"

                  if "SYSCALL_DEFINE3(setresuid" in sys_c:
                      sys_c = sys_c.replace("SYSCALL_DEFINE3(setresuid", decl + "SYSCALL_DEFINE3(setresuid", 1)
                      sys_c = re.sub(r"(SYSCALL_DEFINE3\s*\(\s*setresuid\s*,[^)]*\)\s*\{)", r"\1" + hook_str, sys_c, count=1)
                  elif "__sys_setresuid" in sys_c:
                      sys_c = sys_c.replace("int __sys_setresuid", decl + "int __sys_setresuid", 1)
                      sys_c = re.sub(r"(int\s+__sys_setresuid\s*\([^)]*\)\s*\{)", r"\1" + hook_str, sys_c, count=1)

                  with open(sys_path, "w") as f:
                      f.write(sys_c)

          # 3. تعديلات file_wrapper.c
          fw_path = "drivers/kernelsu/infra/file_wrapper.c"
          if os.path.exists(fw_path):
              with open(fw_path, "r") as f:
                  content = f.read()
              content = content.replace("static void ksu_release_file_wrapper", "void ksu_release_file_wrapper")
              content = re.sub(r"p->ops\.remap_file_range\s*=.*?;", "/* p->ops.remap_file_range disabled */", content)
              content = re.sub(r"p->ops\.fadvise\s*=.*?;", "/* p->ops.fadvise disabled */", content)
              content = content.replace("REMAP_FILE_DEDUP", "0")
              content = re.sub(r"(static\s+\w+\s+ksu_wrapper_remap_file_range\s*\(.*?\n\{)(.*?\n\})(\s*\})?", r"/* \1\2\3 */", content, flags=re.DOTALL)
              with open(fw_path, "w") as f:
                  f.write(content)

          # 4. تعديلات access_ok
          for root, dirs, files in os.walk("drivers/kernelsu"):
              for fname in files:
                  if fname.endswith(".c"):
                      filepath = os.path.join(root, fname)
                      with open(filepath, "r") as f:
                          kc = f.read()
                      if "access_ok(" in kc:
                          new_kc = re.sub(r"\baccess_ok\s*\(\s*([^,]+),\s*([^)]+)\)", r"access_ok(0, \1, \2)", kc)
                          if new_kc != kc:
                              with open(filepath, "w") as f:
                                  f.write(new_kc)

          # 5. تعديل selinux
          for root, dirs, files in os.walk("drivers/kernelsu"):
              for fname in files:
                  filepath = os.path.join(root, fname)
                  if fname == "selinux.c":
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace("__is_selinux_state.enforcing()", "selinux_state.enforcing")
                      c = re.sub(r"(?<![a-zA-Z0-9_])selinux_enforcing(?![a-zA-Z0-9_(\w])", "selinux_state.enforcing", c)
                      with open(filepath, "w") as f:
                          f.write(c)
                  elif fname == "rules.c":
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace("extern int avc_ss_reset(u32 seqno);", "/* extern int avc_ss_reset(u32 seqno); */")
                      c = c.replace("avc_ss_reset(0);", "/* avc_ss_reset(0); */")
                      c = c.replace("selinux_status_update_policyload(0);", "/* selinux_status_update_policyload(0); */")
                      c = c.replace("return &policydb;", "return NULL;")
                      with open(filepath, "w") as f:
                          f.write(c)
          EOF

          python3 patch_ksu.py

          # إصلاح مسارات تضمين ميديا تك
          find drivers/misc/mediatek/dbgtop/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <dbgtop.h>@#include "dbgtop.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/debug_latch/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <plat_dbg_info.h>@#include "plat_dbg_info.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/dramc/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <dramc_io.h>@#include "dramc_io.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/emi/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <mt_emi_api.h>@#include "mt_emi_api.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/leds/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <mtk_leds_sw.h>@#include "mtk_leds_sw.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/m4u/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <m4u_port.h>@#include "m4u_port.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/power_throttling/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <mtk_battery_percentage_throttling.h>@#include "mtk_battery_percentage_throttling.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/typec/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include "inc/tcpci.h"@#include "tcpci.h"@g' {} + 2>/dev/null || true

          find drivers/misc/mediatek/clkbuf/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <clkbuf@#include "clkbuf@g; s@#include <clk_buf@#include "clk_buf@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/usb20/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <musb_core.h>@#include "musb_core.h"@g; s@#include <musb.h>@#include "musb.h"@g; s@#include <musb_dr.h>@#include "musb_dr.h"@g; s@#include <mtk_musb.h>@#include "mtk_musb.h"@g; s@#include <musb_debug.h>@#include "musb_debug.h"@g; s@#include <musbhsdma.h>@#include "musbhsdma.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/video/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <display_recorder.h>@#include "display_recorder.h"@g' {} + 2>/dev/null || true
          find drivers/mmc/host/mediatek/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <mtk_sd.h>@#include "mtk_sd.h"@g' {} + 2>/dev/null || true
          find drivers/pinctrl/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@<../../gpio/gpiolib.h>@"../../gpio/gpiolib.h"@g' {} + 2>/dev/null || true
          find drivers/power/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <charger_class.h>@#include "charger_class.h"@g; s@#include <wingtech_charger.h>@#include "wingtech_charger.h"@g' {} + 2>/dev/null || true
          find drivers/soc/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <mtk-pm-qos-trace.h>@#include "mtk-pm-qos-trace.h"@g' {} + 2>/dev/null || true

          find drivers/misc/mediatek/ drivers/soc/mediatek/ kernel/trace/ -type f -name "*.h" 2>/dev/null -exec grep -l "#define TRACE_INCLUDE_PATH \." {} + | while read -r file; do
            rel_file="${file#./}"
            dir=$(dirname "$rel_file")
            sed -i "s@#define TRACE_INCLUDE_PATH \.@#define TRACE_INCLUDE_PATH $dir@g" "$rel_file"
          done

          find drivers/staging/android/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <ion.h>@#include "ion.h"@g' {} + 2>/dev/null || true
          find drivers/staging/android/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <ion_priv.h>@#include "ion_priv.h"@g' {} + 2>/dev/null || true

          # تفعيل إعدادات KSU و SUSFS في ملف defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_TAMPER_SYS_CALL=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SELINUX_HIDE=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT_RESPONSE=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KPM=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/a04_defconfig

          # تعطيل IKHEADERS لحل مشكلة التجميع
          sed -i 's/CONFIG_IKHEADERS=y/CONFIG_IKHEADERS=n/g' arch/arm64/configs/a04_defconfig
          echo "CONFIG_IKHEADERS=n" >> arch/arm64/configs/a04_defconfig

          # تعطيل الحمايات المسببة لإعادة التشغيل
          echo "CONFIG_SEC_RESTRICT_FORK=n" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_SECURITY_DEFEX=n" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_INTEGRITY=n" >> arch/arm64/configs/a04_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/host/linux-x86/clang-r383902/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          export LOCALVERSION="-ReSukiSU-SUSFS"

          EXTRA_FLAGS="-w -O2 -Dion_phys_addr_t=phys_addr_t -DCONFIG_KSU_MANUAL_HOOK=1 -DCONFIG_KSU_TAMPER_SYS_CALL=1 -DCONFIG_KSU_SELINUX_HIDE=1 -DCONFIG_KPM=1 -DCONFIG_KSU_SUSFS=1 -I$(pwd) -I. \
          -I$(pwd)/security/selinux \
          -I$(pwd)/security/selinux/include \
          -I$(pwd)/drivers/staging/android/mtk_ion \
          -I$(pwd)/drivers/staging/android/mtk_ion/mtk \
          -I$(pwd)/drivers/staging/android \
          -I$(pwd)/drivers/staging/android/ion \
          -I$(pwd)/drivers/soc \
          -I$(pwd)/drivers/soc/mediatek \
          -I$(pwd)/drivers/power \
          -I$(pwd)/drivers/power/supply \
          -I$(pwd)/drivers/gpio \
          -I$(pwd)/drivers/pinctrl \
          -I$(pwd)/drivers/pinctrl/mediatek \
          -I$(pwd)/drivers/mmc/host/mediatek \
          -I$(pwd)/drivers/mmc/host/mediatek/ComboA \
          -I$(pwd)/drivers/mmc/host/mediatek/ComboA/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/include \
          -I$(pwd)/drivers/misc/mediatek/include/mt-plat \
          -I$(pwd)/drivers/misc/mediatek/include/mt-plat/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/clkbuf \
