name: Build Samsung A04 Kernel with RKSU

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من زر Run workflow

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu git libssl-dev make python3 wget zip

      - name: Clone RKSU / KernelSU Source
        run: |
          git clone https://github.com/rsuntk/rksu-common.git drivers/rksu || true

      - name: Setup Kernel Config & Integrate Hooks
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # استخدام ملف التكوين الصحيح الخاص بهاتف A04
          make O=out a04_defconfig

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out -j$(nproc)

      - name: Upload Built Image (boot.img / Image)
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A04-RKSU-Boot
          path: out/arch/arm64/boot/Image
