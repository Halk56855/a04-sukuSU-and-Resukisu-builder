name: Build Samsung A04 Kernel with ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git python3 wget zip

      - name: Setup Toolchain (GCC/Clang)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-11.0.0_r30 toolchain

      - name: Inject ReSukiSU via Official Script
        run: |
          # تنفيذ السكريبت الرسمي من الجذر الرئيسي للنواة حصراً
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Add Manual Hooks to Defconfig
        run: |
          # تحديد مسار ملف الـ defconfig وتفعيل المتطلبات الخاصة بالنواة القديمة
          DEFCONFIG_FILE="arch/arm64/configs/mtk_defconfig" # استبدل الاسم بملف الـ defconfig الفعلي لمستودعك إن وجد غير ذلك
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG_FILE

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/toolchain/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-

          make mtk_defconfig
          make -j$(nproc)

      - name: Upload Built Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A04-Kernel-ReSukiSU
          path: arch/arm64/boot/Image.gz-dtb
