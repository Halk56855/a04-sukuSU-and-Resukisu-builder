name: Build Samsung A04 Kernel with ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Clone Kernel Source
        run: |
          # استبدل الرابط أدناه برابط شيفرة مصدر النواة الفعلي لهاتف سامسونج A04
          git clone --depth=1 https://github.com/Halk5685/samsung_a04_kernel.git kernel_source

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git python3 wget zip

      - name: Setup Toolchain (GCC/Clang)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-11.0.0_r30 toolchain

      - name: Inject ReSukiSU
        run: |
          cd kernel_source
          
          # استنساخ مستودع ReSukiSU الرسمي
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git resukisu_repo
          
          # دمج ملفات النواة الخاصة بـ ReSukiSU داخل مجلد drivers للنواة
          if [ -d "drivers" ]; then
            mkdir -p drivers/ksu
            cp -rf resukisu_repo/kernel/* drivers/ksu/
            echo "ReSukiSU injected successfully into drivers/ksu"
          else
            echo "Error: drivers directory not found in kernel source!"
            exit 1
          fi

      - name: Add Manual Hooks to Defconfig
        run: |
          cd kernel_source
          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*_defconfig" | head -n 1)
          if [ -n "$DEFCONFIG_FILE" ]; then
            echo "Found defconfig at: $DEFCONFIG_FILE"
            echo "CONFIG_KSU=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG_FILE"
          else
            echo "Error: Defconfig file not found!"
            exit 1
          fi

      - name: Compile Kernel
        run: |
          cd kernel_source
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/../toolchain/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-

          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*_defconfig" | head -n 1)
          DEFCONFIG_NAME=$(basename "$DEFCONFIG_FILE")
          make $DEFCONFIG_NAME
          make -j$(nproc)

      - name: Upload Built Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A04-Kernel-ReSukiSU
          path: 'kernel_source/arch/arm64/boot/Image.gz-dtb'
