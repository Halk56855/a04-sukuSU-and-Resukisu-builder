name: Build Samsung A04 Kernel with ReSukiSU

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من تبويب Actions في قيت هب

jobs:
  build:
    runs-on: ubuntu-22.04 # بيئة لينكس الافتراضية للتجميع

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git python3 wget zip

      - name: Setup Toolchain (GCC/Clang)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-11.0.0_r30 toolchain

      - name: Inject ReSukiSU into Kernel
        run: |
          cd drivers/
          # استنساخ شيفرة ReSukiSU ووضعها كمجلد فرعي
          git clone https://github.com/依托/ReSukiSU.git kernelsu
          
          # تعديل ملفات التكوين لتضمين الدرايفر
          echo 'source "drivers/kernelsu/Kconfig"' >> Kconfig
          echo 'obj-y += kernelsu/' >> Makefile
          cd ..

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/toolchain/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-

          # ضبط ملف الإعدادات الافتراضي للنواة (يتم تعديل اسم الملف حسب المتاح في المستودع)
          make mtk_defconfig
          
          # بدء عملية التجميع باستخدام كافة أنظار المعالج المتاحة
          make -j$(nproc)

      - name: Upload Built Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A04-Kernel-ReSukiSU
          path: arch/arm64/boot/Image.gz-dtb
