name: Build SukiSU-Ultra Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git libncurses5-dev libssl-dev python3 zlib1g-dev libelf-dev

      - name: Clone SukiSU-Ultra Patch Repository
        run: |
          git clone https://github.com/Halk56855/SukiSU-Ultra-path-4.19.git sukisu_patch_repo

      - name: Apply SukiSU 4.19 Patch to Source
        run: |
          # الباتش موجود في الجذر الرئيسي للمستودع الجديد مباشرة
          git apply sukisu_patch_repo/ksu_hooks_sukisu_4.19-patch

      - name: Setup Toolchain
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 toolchain

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/toolchain/bin:$PATH
          
          make O=out a04_defconfig
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android-

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          zip -r ../SukiSU-Ultra-A04-Final.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Galaxy-A04
          path: SukiSU-Ultra-A04-Final.zip
