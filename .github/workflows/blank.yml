      - name: Package Kernel into AnyKernel3
        run: |
          git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git --depth=1 AnyKernel3
          cp arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=ReSukiSU + SUSFS Kernel for Samsung A04/g' anykernel.sh || true
          sed -i 's/ExampleKernel by osm0sis @ xda-developers/ReSukiSU + SUSFS Kernel/g' anykernel.sh || true

          zip -r9 "../ReSukiSU-SUSFS-Kernel-Samsung-A04.zip" * -x .git README.md *placeholder
          cd ..

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-SUSFS-Kernel-Samsung-A04
          path: ReSukiSU-SUSFS-Kernel-Samsung-A04.zip
