name: Build Samsung A04 Kernel with SukiSU-Ultra & Max Performance

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev git clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl cpio python3

      - name: Download and Extract Kernel Source
        run: |
          curl -L -o Kernel.tar.gz "https://github.com/Halk56855/android_kernel_samsung_a04f/releases/download/V1.0/Kernel.tar.gz"
          tar -xvf Kernel.tar.gz
          chmod -R +w .

      - name: Setup Toolchains
        run: |
          # 64-bit GCC Toolchain
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc64
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> $GITHUB_PATH

          # 32-bit GCC Toolchain
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc32
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> $GITHUB_PATH

          # Clang Toolchain
          mkdir -p toolchain/clang/host/linux-x86
          git clone https://github.com/kdrag0n/proton-clang.git toolchain/clang/host/linux-x86/clang-r383902 --depth=1

          rm -f toolchain/clang/host/linux-x86/clang-r383902/bin/ld
          rm -f toolchain/clang/host/linux-x86/clang-r383902/bin/ld.lld

          echo "$GITHUB_WORKSPACE/toolchain/clang/host/linux-x86/clang-r383902/bin" >> $GITHUB_PATH

      - name: Integrate SukiSU-Ultra & Apply Patches
        run: |
          # دمج SukiSU-Ultra بصيغة builtin
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

          # 1. إنشاء وصلة رمزية لمجلد SELinux
          mkdir -p security/selinux
          if [ ! -d "security/selinux/ss" ]; then
            ln -sf . security/selinux/ss
          fi

          # 2. حقن LINUX_VERSION_CODE (4.19.325 = 267333) و KSU_VERSION في أول كل ملف C/H في SukiSU
          find drivers/kernelsu/ KernelSU/ -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null -exec sed -i '1i#undef LINUX_VERSION_CODE\n#define LINUX_VERSION_CODE 267333\n#ifndef KERNEL_VERSION\n#define KERNEL_VERSION(a,b,c) (((a) << 16) + ((b) << 8) + (c))\n#endif\n#ifndef KSU_VERSION\n#define KSU_VERSION 16\n#endif\n#ifndef KSU_VERSION_FULL\n#define KSU_VERSION_FULL "1.0.0"\n#endif\n#ifndef KSU_VERSION_CODE\n#define KSU_VERSION_CODE 10000\n#endif\n#ifndef KSU_VERSION_NAME\n#define KSU_VERSION_NAME "1.0.0"\n#endif\n#ifndef KSU_INVALID_APPID\n#define KSU_INVALID_APPID -1\n#endif\n#ifndef PER_USER_RANGE\n#define PER_USER_RANGE 100000\n#endif\n#ifndef KSU_MAX_PACKAGE_NAME\n#define KSU_MAX_PACKAGE_NAME 256\n#endif' {} + || true

          # 3. معالجة ورقع ملفات SukiSU لتتوافق تماماً مع نواة 4.19 وإزالة remap_file_range
          python3 -c '
          import os, re

          fw_path = "drivers/kernelsu/infra/file_wrapper.c"
          if os.path.exists(fw_path):
              with open(fw_path, "r") as f:
                  content = f.read()
              
              content = content.replace("static void ksu_release_file_wrapper", "void ksu_release_file_wrapper")
              content = re.sub(r"p->ops\.remap_file_range\s*=.*?;", "/* p->ops.remap_file_range disabled */", content)
              content = re.sub(r"p->ops\.fadvise\s*=.*?;", "/* p->ops.fadvise disabled */", content)
              content = content.replace("REMAP_FILE_DEDUP", "0")
              
              # إزالة أو تعطيل دالة ksu_wrapper_remap_file_range بالكامل لتجنب أخطاء نواة 4.19
              content = re.sub(r"(static\s+\w+\s+ksu_wrapper_remap_file_range\s*\(.*?\n\{)(.*?\n\})(\s*\})?", r"/* \1\2\3 */", content, flags=re.DOTALL)

              with open(fw_path, "w") as f:
                  f.write(content)
              print("Successfully patched file_wrapper.c for Kernel 4.19")

          # إصلاح ملفات SELinux في SukiSU لتوافق نواة 4.19 وإلغاء التعارضات
          for root, dirs, files in os.walk("drivers/kernelsu"):
              for file in files:
                  filepath = os.path.join(root, file)
                  if file == "selinux.c":
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace("selinux_enforcing", "selinux_state.enforcing")
                      with open(filepath, "w") as f:
                          f.write(c)
                  elif file == "rules.c":
                      with open(filepath, "r") as f:
                          c = f.read()
                      c = c.replace("extern int avc_ss_reset(u32 seqno);", "/* extern int avc_ss_reset(u32 seqno); */")
                      c = c.replace("avc_ss_reset(0);", "/* avc_ss_reset(0); */")
                      c = c.replace("selinux_status_update_policyload(0);", "/* selinux_status_update_policyload(0); */")
                      c = c.replace("return &policydb;", "return NULL;")
                      with open(filepath, "w") as f:
                          f.write(c)
          print("Successfully patched SELinux files for Kernel 4.19")

          # كتابة Makefile الموحد لـ KernelSU
          target_dirs = ["drivers/kernelsu", "KernelSU"]
          ksu_dir = None
          for d in target_dirs:
              if os.path.exists(d):
                  ksu_dir = d
                  break

          if ksu_dir:
              inc_dirs = []
              for root, dirs, files in os.walk(ksu_dir):
                  if "kpm" in dirs:
                      dirs.remove("kpm")
                  for d in dirs:
                      rel_d = os.path.relpath(os.path.join(root, d), ksu_dir)
                      inc_dirs.append(rel_d)

              inc_flags = " ".join([f"-I$(srctree)/$(src)/{d}" for d in set(inc_dirs) if d != "."])
              mk_path = os.path.join(ksu_dir, "Makefile")
              mk_content = f"""
          obj-y += kernelsu.o
          kernelsu-objs := ksu.o
          ccflags-y += -DLINUX_VERSION_CODE=267333 -DKSU_VERSION=16 -DKSU_VERSION_FULL=\\"1.0.0\\" -DKSU_VERSION_CODE=10000 -DKSU_VERSION_NAME=\\"1.0.0\\" -I$(srctree)/$(src) -I$(srctree)/$(src)/include -I$(srctree)/security/selinux -I$(srctree)/security/selinux/include {inc_flags} -DCONFIG_KSU_SELINUX_HIDE=1
          """
              with open(mk_path, "w") as f:
                  f.write(mk_content.strip() + "\n")
              print("Successfully created custom Makefile for SukiSU")
          '

          # 4. إصلاح fallthrough
          find drivers/kernelsu/ KernelSU/ -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null -exec sed -i 's@\bfallthrough;@/* fallthrough */;@g' {} + || true

          # 5. إصلاح خطأ تمرير المؤشر في sulog/event.c
          find drivers/kernelsu/ KernelSU/ -name "event.c" 2>/dev/null -exec sed -i 's/#define USER_ARG_NULL user_arg_null_ptr()/#define USER_ARG_NULL (*user_arg_null_ptr())/g' {} + || true

          # 6. إصلاح تضمين ملفات الرأس المحلية لبرامج تشغيل MediaTek
          find drivers/misc/mediatek/dbgtop/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <dbgtop.h>@#include "dbgtop.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/debug_latch/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <plat_dbg_info.h>@#include "plat_dbg_info.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/dramc/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <dramc_io.h>@#include "dramc_io.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/emi/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <mt_emi_api.h>@#include "mt_emi_api.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/leds/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <mtk_leds_sw.h>@#include "mtk_leds_sw.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/m4u/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <m4u_port.h>@#include "m4u_port.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/power_throttling/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <mtk_battery_percentage_throttling.h>@#include "mtk_battery_percentage_throttling.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/typec/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include "inc/tcpci.h"@#include "tcpci.h"@g' {} + 2>/dev/null || true

          find drivers/misc/mediatek/clkbuf/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <clkbuf@#include "clkbuf@g; s@#include <clk_buf@#include "clk_buf@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/usb20/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <musb_core.h>@#include "musb_core.h"@g; s@#include <musb.h>@#include "musb.h"@g; s@#include <musb_dr.h>@#include "musb_dr.h"@g; s@#include <mtk_musb.h>@#include "mtk_musb.h"@g; s@#include <musb_debug.h>@#include "musb_debug.h"@g; s@#include <musbhsdma.h>@#include "musbhsdma.h"@g' {} + 2>/dev/null || true
          find drivers/misc/mediatek/video/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <display_recorder.h>@#include "display_recorder.h"@g' {} + 2>/dev/null || true
          find drivers/mmc/host/mediatek/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <mtk_sd.h>@#include "mtk_sd.h"@g' {} + 2>/dev/null || true
          find drivers/pinctrl/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@<../../gpio/gpiolib.h>@"../../gpio/gpiolib.h"@g' {} + 2>/dev/null || true
          find drivers/power/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <charger_class.h>@#include "charger_class.h"@g; s@#include <wingtech_charger.h>@#include "wingtech_charger.h"@g' {} + 2>/dev/null || true
          find drivers/soc/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <mtk-pm-qos-trace.h>@#include "mtk-pm-qos-trace.h"@g' {} + 2>/dev/null || true

          # 7. إصلاح مسار TRACE_INCLUDE_PATH
          find drivers/misc/mediatek/ drivers/soc/mediatek/ kernel/trace/ -type f -name "*.h" 2>/dev/null -exec grep -l "#define TRACE_INCLUDE_PATH \." {} + | while read -r file; do
            rel_file="${file#./}"
            dir=$(dirname "$rel_file")
            sed -i "s@#define TRACE_INCLUDE_PATH \.@#define TRACE_INCLUDE_PATH $dir@g" "$rel_file"
          done

          find drivers/staging/android/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <ion.h>@#include "ion.h"@g' {} + 2>/dev/null || true
          find drivers/staging/android/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <ion_priv.h>@#include "ion_priv.h"@g' {} + 2>/dev/null || true

          # إعدادات SukiSU الأساسية وأقصى أداء آمن للـ CPU و GPU في defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_TAMPER_SYS_CALL=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SELINUX_HIDE=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KPM=n" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/a04_defconfig

          # تفعيل خيارات الأداء القصوى لمنظم التردد (Performance Governors)
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> arch/arm64/configs/a04_defconfig

          # تعطيل الخيارات المتعارضة
          echo "CONFIG_MAC80211_DRIVER_API_TRACER=n" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS=n" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_SU=n" >> arch/arm64/configs/a04_defconfig
          echo "CONFIG_IKHEADERS=n" >> arch/arm64/configs/a04_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/host/linux-x86/clang-r383902/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          EXTRA_FLAGS="-w -O3 -Dion_phys_addr_t=phys_addr_t -DCONFIG_KSU_SELINUX_HIDE=1 -I$(pwd) -I. \
          -I$(pwd)/security/selinux \
          -I$(pwd)/security/selinux/include \
          -I$(pwd)/drivers/staging/android/mtk_ion \
          -I$(pwd)/drivers/staging/android/mtk_ion/mtk \
          -I$(pwd)/drivers/staging/android \
          -I$(pwd)/drivers/staging/android/ion \
          -I$(pwd)/drivers/soc \
          -I$(pwd)/drivers/soc/mediatek \
          -I$(pwd)/drivers/power \
          -I$(pwd)/drivers/power/supply \
          -I$(pwd)/drivers/gpio \
          -I$(pwd)/drivers/pinctrl \
          -I$(pwd)/drivers/pinctrl/mediatek \
          -I$(pwd)/drivers/mmc/host/mediatek \
          -I$(pwd)/drivers/mmc/host/mediatek/ComboA \
          -I$(pwd)/drivers/mmc/host/mediatek/ComboA/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/include \
          -I$(pwd)/drivers/misc/mediatek/include/mt-plat \
          -I$(pwd)/drivers/misc/mediatek/include/mt-plat/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/clkbuf \
          -I$(pwd)/drivers/misc/mediatek/clkbuf/inc \
          -I$(pwd)/drivers/misc/mediatek/clkbuf/src \
          -I$(pwd)/drivers/misc/mediatek/clkbuf/v1 \
          -I$(pwd)/drivers/misc/mediatek/clkbuf/v2 \
          -I$(pwd)/drivers/misc/mediatek/clkbuf/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/clkbuf/src/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/cmdq/v3 \
          -I$(pwd)/drivers/misc/mediatek/cmdq/v3/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/dbgtop \
          -I$(pwd)/drivers/misc/mediatek/debug_latch \
          -I$(pwd)/drivers/misc/mediatek/debug_latch/plat_dbg_info \
          -I$(pwd)/drivers/misc/mediatek/dramc \
          -I$(pwd)/drivers/misc/mediatek/dramc/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/emi \
          -I$(pwd)/drivers/misc/mediatek/emi/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/leds \
          -I$(pwd)/drivers/misc/mediatek/leds/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/m4u \
          -I$(pwd)/drivers/misc/mediatek/m4u/2.0 \
          -I$(pwd)/drivers/misc/mediatek/m4u/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/mmdvfs \
          -I$(pwd)/drivers/misc/mediatek/power_throttling \
          -I$(pwd)/drivers/misc/mediatek/usb20 \
          -I$(pwd)/drivers/misc/mediatek/video \
          -I$(pwd)/drivers/misc/mediatek/video/common \
          -I$(pwd)/drivers/misc/mediatek/video/common/display_recorder \
          -I$(pwd)/drivers/misc/mediatek/video/common/layering_rule_base \
          -I$(pwd)/drivers/misc/mediatek/video/common/layering_rule_base/v1.1 \
          -I$(pwd)/drivers/misc/mediatek/video/common/layering_rule_base/v1.1/inc \
          -I$(pwd)/drivers/misc/mediatek/video/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/video/mt6765/videox \
          -I$(pwd)/drivers/misc/mediatek/video/mt6765/dispsys \
          -I$(pwd)/drivers/misc/mediatek/video/include \
          -I$(pwd)/drivers/misc/mediatek/typec \
          -I$(pwd)/drivers/misc/mediatek/typec/tcpc \
          -I$(pwd)/drivers/misc/mediatek/typec/tcpc/inc \
          -I$(pwd)/drivers/misc/mediatek/scp \
          -I$(pwd)/drivers/misc/mediatek/scp/inc \
          -I$(pwd)/drivers/misc/mediatek/scp/cm4 \
          -I$(pwd)/drivers/misc/mediatek/scp/cm4/v01 \
          -I$(pwd)/drivers/misc/mediatek/scp/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/ext_disp \
          -I$(pwd)/drivers/misc/mediatek/ext_disp/include \
          -I$(pwd)/drivers/misc/mediatek/ext_disp/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/ext_disp/mt6765/include \
          -I$(pwd)/drivers/misc/mediatek/eccci \
          -I$(pwd)/drivers/misc/mediatek/eccci/inc \
          -I$(pwd)/drivers/misc/mediatek/eccci/hif \
          -I$(pwd)/drivers/misc/mediatek/eccci/fsm \
          -I$(pwd)/drivers/misc/mediatek/eccci/port \
          -I$(pwd)/drivers/misc/mediatek/eccci/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/base/power/ppm_v3/inc \
          -I$(pwd)/drivers/misc/mediatek/base/power/ppm_v3/inc/mach/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/base/power/spm \
          -I$(pwd)/drivers/misc/mediatek/base/power/spm/inc \
          -I$(pwd)/drivers/misc/mediatek/base/power/spm/common \
          -I$(pwd)/drivers/misc/mediatek/base/power/spm/common/mtk_idle_fs \
          -I$(pwd)/drivers/misc/mediatek/base/power/spm/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/base/power/spm/mt6765/inc \
          -I$(pwd)/drivers/misc/mediatek/base/power/include \
          -I$(pwd)/drivers/misc/mediatek/base/power/include/spm \
          -I$(pwd)/drivers/misc/mediatek/base/power/include/spm/mt6765 \
          -I$(pwd)/drivers/misc/mediatek/base/power/qos \
          -I$(pwd)/drivers/misc/mediatek/ccu/inc \
          -I$(pwd)/drivers/misc/mediatek/ccu/src \
          -I$(pwd)/drivers/misc/mediatek/ccu/src/mt6765"

          make a04_defconfig
          make -j$(nproc) KCFLAGS="$EXTRA_FLAGS" WERROR=0 HOSTCC=gcc HOSTCXX=g++ || make -j1 KCFLAGS="$EXTRA_FLAGS" WERROR=0 HOSTCC=gcc HOSTCXX=g++

      - name: Upload Kernel Output
        uses: actions/upload-artifact@v4
        with:
          name: A04-SukiSU-Kernel-Image
          path: arch/arm64/boot/Image*
