name: Build Samsung A04 Kernel with TragicHorizon & AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Samsung-Galaxy-G85-JDM/kernel_samsung_a05m
          ref: linux-4.19.y
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex git libssl-dev make python3 wget zip clang lld llvm

      - name: Clone ReSukiSU Source
        run: |
          git clone https://github.com/rsuntk/resukisu-common.git drivers/resukisu || true

      - name: Set Custom Kernel Version & Localversion
        run: |
          sed -i 's/^VERSION =.*/VERSION = 4/' Makefile
          sed -i 's/^PATCHLEVEL =.*/PATCHLEVEL = 19/' Makefile
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 325/' Makefile
          echo "CONFIG_LOCALVERSION=\"-TragicHorizon-v3-r1\"" >> arch/arm64/configs/rsuntk-a04_defconfig

      - name: Setup Kernel Config
        run: |
          # تمرير المتغيرات مباشرة في سطر make لمنع تجاهلها
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- rsuntk-a04_defconfig

      - name: Build Kernel Image
        run: |
          # استخدام المترجمات الصحيحة لمنع أخطاء التجميع
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang OBJDUMP=llvm-objdump -j$(nproc)

      - name: Pack Kernel with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/BLOCK=.*/BLOCK=auto;/' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel.sh
          zip -r9 ../AnyKernel3-TragicHorizon-A04.zip * -x .git* README.md *placeholder

      - name: Upload AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-TragicHorizon-v3-r1-A04
          path: AnyKernel3-TragicHorizon-A04.zip
