name: Patch Boot Image with SukiSU-Ultra

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download boot.img from Release
        run: |
          # تحميل ملف boot.img مباشرة من آخر إصدار في مستودعك
          curl -L https://github.com/Halk56855/Boot-a04/releases/latest/download/boot.img -O
          ls -lh boot.img

      - name: Extract Kernel Image using Magiskboot
        run: |
          # تحميل أداة فك وتجميع صور الإقلاع magiskboot
          wget https://github.com/xiaoxindada/magiskboot_binary/raw/master/magiskboot -O magiskboot
          chmod +x magiskboot
          
          # فك ملف boot.img لاستخراج نواة Image الخام
          ./magiskboot unpack boot.img
          ls -la

      - name: Apply SukiSU-Ultra Patch
        run: |
          # تحميل أدوات الرقعة kptools
          wget https://github.com/KernelPatch/KPM/releases/latest/download/kptools-linux -O kptools
          chmod +x kptools
          
          # ملاحظة: إذا كنت تملك ملف kpimg الخاص برقعة SukiSU، قم بتوفيره أو سحبه هنا، 
          # أو تطبيق الرقعة المباشرة على ملف kernel (Image) المستخرج
          # مثال تطبيق الرقعة:
          # ./kptools -p -i kernel -k kpimg -s Kahg13579 -o patched_image
          # cp patched_image kernel

      - name: Repack and Package with AnyKernel3
        run: |
          # استنساخ حزمة AnyKernel3 لتغليفه للتفليش
          git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
          
          # نقل النواة (سواء كانت مرقعة أو أصلية للاختبار) إلى مجلد AnyKernel3 باسم Image
          cp kernel AnyKernel3/Image
          
          # ضغط الملفات بصيغة ZIP جاهزة للتفليش عبر الريكفري
          cd AnyKernel3
          zip -r ../SukiSU-Ultra-A04-Boot-Final.zip *

      - name: Upload Flashable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Galaxy-A04-Flashable
          path: SukiSU-Ultra-A04-Boot-Final.zip
