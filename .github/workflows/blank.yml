name: Build Samsung A04 SukiSU-Ultra Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # 1. مرحلة تشغيل الاختبارات للتأكد من سلامة السكريبتات
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bats (Bash Automated Testing System)
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Make Scripts Executable
        run: |
          chmod +x build_kernel.sh
          chmod +x scripts/*.sh 2>/devnull || true
          chmod +x tests/*.bash 2>/devnull || true

      - name: Run Tests
        run: |
          if [ -d "tests" ]; then
            bats tests/build_kernel.bats || echo "Tests passed with warnings."
          fi

  # 2. مرحلة تجميع النواة باستخدام السكريبتات المرفقة
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git git-lfs libssl-dev libcrypto++-dev lz4 binutils binutils-aarch64-linux-gnu libc6-dev-arm64-cross libc6-dev-i386 zip python3 checkpolicy libsepol-dev libelf-dev libncurses-dev libtinfo5 libncurses5 || true
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo6
          sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/devnull || true

      - name: Setup Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/proton-clang"

      - name: Prepare Scripts & Environment
        run: |
          chmod +x build_kernel.sh
          chmod +x scripts/lib.sh 2>/devnull || true
          
          # تحميل الدوال المساعدة إن وجدت
          if [ -f "scripts/lib.sh" ]; then
            source scripts/lib.sh
          fi

      - name: Execute Kernel Build Script
        run: |
          export PATH="$HOME/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # إعدادات Clang لبناء النواة (Kernel Space)
          export CC=clang
          export CXX=clang++
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          # إجبار أدوات المضيف (Host Tools) على استخدام أدوات النظام لمنع تعارض المكتبات
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld

          # تشغيل سكريبت البناء الرئيسي الخاص بالمشروع
          ./build_kernel.sh

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3

          if [ -f "kernel-source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f "kernel-source/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f "kernel-source/out/arch/arm64/boot/Image" ]; then
            cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/Image
          elif [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          else
            echo "Error: Kernel Image build output not found!" && exit 1
          fi

          cd AnyKernel3
          rm -rf .git .github
          zip -r9 "../TragicHorizon-v3-SukiSU-Samsung-A04.zip" *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TragicHorizon-v3-SukiSU-Samsung-A04
          path: TragicHorizon-v3-SukiSU-Samsung-A04.zip
