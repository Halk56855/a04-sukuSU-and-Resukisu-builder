name: Build Samsung A04 Kernel with TragicHorizon & AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Samsung-Galaxy-G85-JDM/kernel_samsung_a05m
          ref: linux-4.19.y
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex git libssl-dev make python3 wget zip clang lld llvm g++-aarch64-linux-gnu gcc-aarch64-linux-gnu curl

      - name: Setup ReSukiSU (Official Setup Script)
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

      - name: Bypass ReSukiSU Manual Hook Strict Check
        run: |
          if [ -f KernelSU/kernel/tools/manual_hook_check.mk ]; then
            echo "" > KernelSU/kernel/tools/manual_hook_check.mk
          fi

      - name: Fix Clang Strict Prototypes Error
        run: |
          sed -i 's/int is_ib_init_succeed()/int is_ib_init_succeed(void)/g' drivers/input/input_booster.c

      - name: Fix Cgroup Defs Clang Warning
        run: |
          sed -i '1i #pragma clang diagnostic ignored "-Wgnu-variable-sized-type-not-at-end"' include/linux/cgroup-defs.h

      - name: Remove Problematic Touchscreen and Input Drivers
        run: |
          rm -rf drivers/input/touchscreen/gt9895
          rm -rf drivers/input/aw9610x_sar
          rm -rf drivers/input/hx9031a_sar
          
          sed -i '/gt9895/d' drivers/input/touchscreen/Makefile || true
          sed -i '/gt9895/d' drivers/input/touchscreen/Kconfig || true
          sed -i '/aw9610x_sar/d' drivers/input/Makefile || true
          sed -i '/aw9610x_sar/d' drivers/input/Kconfig || true
          sed -i '/hx9031a_sar/d' drivers/input/Makefile || true
          sed -i '/hx9031a_sar/d' drivers/input/Kconfig || true

      - name: Completely Remove All Mediatek Drivers and References
        run: |
          rm -rf drivers/input/touchscreen/mediatek
          sed -i '/mediatek/d' drivers/input/touchscreen/Makefile || true
          sed -i '/mediatek/d' drivers/input/touchscreen/Kconfig || true
          
          rm -rf drivers/mmc/host/mediatek
          sed -i '/mediatek/d' drivers/mmc/host/Makefile || true
          sed -i '/mediatek/d' drivers/mmc/host/Kconfig || true

          rm -rf drivers/misc/mediatek
          sed -i '/mediatek/d' drivers/misc/Makefile || true
          sed -i '/mediatek/d' drivers/misc/Kconfig || true

      - name: Remove Unused Char Drivers Causing Clang Errors
        run: |
          rm -rf drivers/char/agp drivers/char/hw_random drivers/char/ipmi drivers/char/mwave drivers/char/pcmcia drivers/char/tpm drivers/char/xilinx_hwicap drivers/char/xillybus
          
          sed -i '/agp/d' drivers/char/Makefile || true
          sed -i '/hw_random/d' drivers/char/Makefile || true
          sed -i '/ipmi/d' drivers/char/Makefile || true
          sed -i '/mwave/d' drivers/char/Makefile || true
          sed -i '/pcmcia/d' drivers/char/Makefile || true
          sed -i '/tpm/d' drivers/char/Makefile || true
          sed -i '/xilinx_hwicap/d' drivers/char/Makefile || true
          sed -i '/xillybus/d' drivers/char/Makefile || true
          
          sed -i '/agp/d' drivers/char/Kconfig || true
          sed -i '/hw_random/d' drivers/char/Kconfig || true
          sed -i '/ipmi/d' drivers/char/Kconfig || true
          sed -i '/mwave/d' drivers/char/Kconfig || true
          sed -i '/pcmcia/d' drivers/char/Kconfig || true
          sed -i '/tpm/d' drivers/char/Kconfig || true
          sed -i '/xilinx_hwicap/d' drivers/char/Kconfig || true
          sed -i '/xillybus/d' drivers/char/Kconfig || true
          
          sed -i '/agp/d' drivers/video/Kconfig || true

      - name: Fix KGDB Constraint Error for Clang
        run: |
          sed -i 's/asm ("brk %0" : : "I" (KGDB_COMPILED_DBG_BRK_IMM));/asm ("brk #0x401");/g' arch/arm64/include/asm/kgdb.h || true

      - name: Apply ReSukiSU Static Symbol Fixes (SELinux)
        run: |
          find security/selinux/ -type f -name "*.c" | while read -r file; do
            sed -i 's/static const struct file_operations sel_handle_status_ops/const struct file_operations sel_handle_status_ops/g' "$file" || true
            sed -i 's/static DEFINE_MUTEX(sel_mutex);/DEFINE_MUTEX(sel_mutex);/g' "$file" || true
            sed -i 's/static DEFINE_RWLOCK(policy_rwlock);/DEFINE_RWLOCK(policy_rwlock);/g' "$file" || true
            sed -i 's/static struct page \*selinux_status_page;/struct page \*selinux_status_page;/g' "$file" || true
            sed -i 's/static DEFINE_MUTEX(selinux_status_lock);/DEFINE_MUTEX(selinux_status_lock);/g' "$file" || true
            sed -i 's/static struct security_operations selinux_ops/struct security_operations selinux_ops/g' "$file" || true
          done

      - name: Set Custom Kernel Version & Localversion
        run: |
          sed -i 's/^VERSION =.*/VERSION = 4/' Makefile
          sed -i 's/^PATCHLEVEL =.*/PATCHLEVEL = 19/' Makefile
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 325/' Makefile
          
          ./scripts/config --file arch/arm64/configs/rsuntk-a04_defconfig --set-val CONFIG_KSU y
          ./scripts/config --file arch/arm64/configs/rsuntk-a04_defconfig --set-val CONFIG_KSU_MANUAL_HOOK y
          ./scripts/config --file arch/arm64/configs/rsuntk-a04_defconfig --set-val CONFIG_KALLSYMS y
          ./scripts/config --file arch/arm64/configs/rsuntk-a04_defconfig --set-val CONFIG_KALLSYMS_ALL y
          ./scripts/config --file arch/arm64/configs/rsuntk-a04_defconfig --disable CONFIG_WERROR
          ./scripts/config --file arch/arm64/configs/rsuntk-a04_defconfig --disable CONFIG_GKI_HIDDEN_DRM_CONFIGS || true
          ./scripts/config --file arch/arm64/configs/rsuntk-a04_defconfig --set-val CONFIG_DRM y || true
          ./scripts/config --file arch/arm64/configs/rsuntk-a04_defconfig --set-str CONFIG_LOCALVERSION "-TragicHorizon-v3-r1"

      - name: Setup Kernel Config
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out rsuntk-a04_defconfig

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-array-bounds -Wno-gnu-variable-sized-type-not-at-end" \
            KBUILD_CFLAGS="-Wno-error" \
            -j$(nproc) Image.gz || make O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-array-bounds -Wno-gnu-variable-sized-type-not-at-end" \
            KBUILD_CFLAGS="-Wno-error" \
            -j$(nproc) Image

      - name: Pack Kernel with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi
          
          cd AnyKernel3
          sed -i 's/BLOCK=.*/BLOCK=auto;/' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel.sh
          zip -r9 ../AnyKernel3-TragicHorizon-A04.zip * -x .git* README.md *placeholder

      - name: Upload AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-TragicHorizon-v3-r1-A04
          path: AnyKernel3-TragicHorizon-A04.zip
