name: Build Samsung A04 Kernel with SukiSU-Ultra & Max Performance

on:
  workflow_dispatch:
    inputs:
      CCACHE_ENABLE:
        description: 'Enable ccache'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            bc \
            git \
            wget \
            zip \
            unzip \
            python3 \
            clang \
            llvm \
            lld

      - name: Download and Extract Kernel Source
        run: |
          echo "Downloading kernel source archive..."
          wget -O Kernel.tar.gz https://github.com/Halk56855/android_kernel_samsung_a04f/releases/download/V1.0/Kernel.tar.gz
          mkdir -p kernel_source
          echo "Extracting kernel source..."
          tar -xzf Kernel.tar.gz -C kernel_source --strip-components=1 || tar -xzf Kernel.tar.gz -C kernel_source

      - name: Fix KPM Path
        run: |
          cd kernel_source
          echo "Fixing KPM path (copying kpms to kpm)..."
          if [ -d "drivers/kernelsu/kpms" ] && [ ! -d "drivers/kernelsu/kpm" ]; then
            cp -r drivers/kernelsu/kpms drivers/kernelsu/kpm
          elif [ -d "kernel/drivers/kernelsu/kpms" ] && [ ! -d "kernel/drivers/kernelsu/kpm" ]; then
            cp -r kernel/drivers/kernelsu/kpms kernel/drivers/kernelsu/kpm
          fi

      - name: Build Kernel
        run: |
          cd kernel_source
          echo "Starting kernel compilation..."
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out defconfig
          make O=out -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A04-Kernel-SukiSU
          path: |
            kernel_source/out/arch/arm64/boot/Image
            kernel_source/out/arch/arm64/boot/dts/*.dtb
