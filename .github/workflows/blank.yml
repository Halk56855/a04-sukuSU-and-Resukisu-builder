      - name: Package Kernel into AnyKernel3 (ReSukiSU Named)
        run: |
          git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git --depth=1 AnyKernel3
          cp arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=ReSukiSU Kernel for Samsung A04/g' anykernel.sh || true
          sed -i 's/ExampleKernel by osm0sis @ xda-developers/ReSukiSU Kernel/g' anykernel.sh || true

          zip -r9 "../ReSukiSU-Kernel-Samsung-A04.zip" * -x .git README.md *placeholder
          cd ..

      - name: Upload ReSukiSU Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-Kernel-Samsung-A04
          path: ReSukiSU-Kernel-Samsung-A04.zip
