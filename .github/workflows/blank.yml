name: Ultimate AI Auto-Fix Kernel Build (Samsung Wingtech)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Choose Kernel Branch'
        required: true
        default: 'a04-u8'
        type: choice
        options:
          - a04-u8
          - android-4.19-stable
          - U8
          - rebased
          - ui7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: NovaAgatha/kernel_samsung_wingtech
          ref: ${{ github.event.inputs.branch || 'a04-u8' }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev git clang gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi curl cpio python3 zip patch

      - name: Clean & Setup Toolchains
        run: |
          rm -rf toolchain gcc64 gcc32
          
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc64
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> $GITHUB_PATH

          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc32
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> $GITHUB_PATH

          mkdir -p toolchain/clang/host/linux-x86
          git clone https://github.com/kdrag0n/proton-clang.git toolchain/clang/host/linux-x86/clang-r383902 --depth=1

      - name: Integrate ReSukiSU and SUSFS Safely
        run: |
          set +e
          rm -rf kernel/ksu drivers/kernelsu
          
          # Integrate ReSukiSU
          git clone https://github.com/ReSukiSU/ReSukiSU.git --depth=1 resuki_repo
          if [ -f "resuki_repo/kernel/setup.sh" ]; then
            bash resuki_repo/kernel/setup.sh main
          else
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          fi
          rm -rf resuki_repo

          # Integrate SUSFS Kernel Files Robustly
          mkdir -p include/linux fs
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 --depth=1 susfs_repo || \
          git clone https://gitlab.com/simonpunk/susfs4ksu.git --depth=1 susfs_repo || \
          git clone https://github.com/gitlab4dev/susfs4ksu.git --depth=1 susfs_repo || \
          git clone https://github.com/infectedmushi/susfs4ksu.git --depth=1 susfs_repo || true

          if [ -d "susfs_repo" ]; then
            find susfs_repo/ -name "susfs.h" -exec cp {} include/linux/ \; 2>/dev/null || true
            find susfs_repo/ -name "susfs_def.h" -exec cp {} include/linux/ \; 2>/dev/null || true
            find susfs_repo/ -name "sus_su.h" -exec cp {} include/linux/ \; 2>/dev/null || true
            find susfs_repo/ -name "susfs.c" -exec cp {} fs/ \; 2>/dev/null || true
            rm -rf susfs_repo
          fi

          # Neutralize kheaders & setup security links
          if [ -f "kernel/gen_kheaders.sh" ]; then
            echo "#!/bin/sh" > kernel/gen_kheaders.sh
            echo "exit 0" >> kernel/gen_kheaders.sh
            chmod +x kernel/gen_kheaders.sh
          fi
          mkdir -p kernel
          touch kernel/kheaders_data.tar.xz 2>/dev/null || true

          mkdir -p security/selinux
          if [ ! -d "security/selinux/ss" ]; then
            ln -sf . security/selinux/ss
          fi
          set -e

      - name: Smart AI Auto-Fix & Safety Patching Engine
        run: |
          echo "" | base64 -d > ai_autofix_engine.py
          python3 ai_autofix_engine.py

      - name: Fix MediaTek Headers
        run: |
          find drivers/misc/mediatek/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's@#include <dbgtop.h>@#include "dbgtop.h"@g' {} + 2>/dev/null || true
          if [ -d "security/defex" ]; then
            echo "obj-y :=" > security/defex/Makefile 2>/dev/null || true
          fi

      - name: Compile Kernel with ReSukiSU & SUSFS Enabled
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          CLANG_PATH="$GITHUB_WORKSPACE/toolchain/clang/host/linux-x86/clang-r383902/bin"
          GCC64_PATH="$GITHUB_WORKSPACE/gcc64/bin"
          GCC32_PATH="$GITHUB_WORKSPACE/gcc32/bin"
          
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          EXTRA_FLAGS="-w -O2 -fpermissive -Wno-error -Wno-initializer-overrides -Wno-format -Wno-enum-conversion -Wno-implicit-fallthrough -Dion_phys_addr_t=phys_addr_t -DCONFIG_KSU_MANUAL_HOOK=1 -DCONFIG_KSU_TAMPER_SYS_CALL=1 -DCONFIG_KSU_SELINUX_HIDE=1 -DCONFIG_KSU_SUSFS=1 -I$(pwd) -I. -I$(pwd)/include -I$(pwd)/kernel/trace -Ikernel/trace"

          DEFCONFIG_FOUND=""
          for cfg in a04_defconfig a045f_defconfig a04m_defconfig a05_defconfig a05m_defconfig a04_eur_open_defconfig wingtech_defconfig; do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              DEFCONFIG_FOUND="$cfg"
              break
            fi
          done

          if [ -n "$DEFCONFIG_FOUND" ]; then
            echo "Using found defconfig: $DEFCONFIG_FOUND"
            make $DEFCONFIG_FOUND
          else
            echo "Fallback to default make defconfig"
            make defconfig
          fi

          echo "CONFIG_KALLSYMS=y" >> .config
          echo "CONFIG_KALLSYMS_ALL=y" >> .config
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> .config
          echo "CONFIG_KSU_TAMPER_SYS_CALL=y" >> .config
          echo "CONFIG_KSU_SELINUX_HIDE=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          echo "CONFIG_IKHEADERS=n" >> .config

          sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' .config || true
          sed -i 's/CONFIG_PROCA=y/CONFIG_PROCA=n/g' .config || true
          sed -i 's/CONFIG_FIVE=y/CONFIG_FIVE=n/g' .config || true

          make olddefconfig

          export PATH="$GCC64_PATH:$GCC32_PATH:/usr/bin:/bin"

          make -j$(nproc) \
            CC="$CLANG_PATH/clang" \
            AR="$CLANG_PATH/llvm-ar" \
            NM="$CLANG_PATH/llvm-nm" \
            OBJCOPY="$CLANG_PATH/llvm-objcopy" \
            OBJDUMP="$CLANG_PATH/llvm-objdump" \
            STRIP="$CLANG_PATH/llvm-strip" \
            KCFLAGS="$EXTRA_FLAGS" \
            HOSTCFLAGS="-Wno-error=deprecated-declarations -Wno-deprecated-declarations" \
            WERROR=0 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld || \
          make -j1 \
            CC="$CLANG_PATH/clang" \
            AR="$CLANG_PATH/llvm-ar" \
            NM="$CLANG_PATH/llvm-nm" \
            OBJCOPY="$CLANG_PATH/llvm-objdump" \
            STRIP="$CLANG_PATH/llvm-strip" \
            KCFLAGS="$EXTRA_FLAGS" \
            HOSTCFLAGS="-Wno-error=deprecated-declarations -Wno-deprecated-declarations" \
            WERROR=0 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git --depth=1 AnyKernel3
          cp arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=ReSukiSU + SUSFS Stable Kernel (Wingtech A04\/A05)/g' anykernel.sh || true
          zip -r9 "../ReSukiSU-SUSFS-Kernel-Wingtech.zip" * -x .git README.md *placeholder
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-SUSFS-Kernel-Wingtech
          path: ReSukiSU-SUSFS-Kernel-Wingtech.zip
