name: Build Samsung A04 Kernel with ReSukiSU and SuFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_kernel_samsung_a04.git kernel_source

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git python3 wget zip make clang llvm

      - name: Setup Correct Clang Toolchain (clang-r383902)
        run: |
          mkdir -p toolchain/clang/host/linux-x86
          cd toolchain/clang/host/linux-x86
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git config core.sparseCheckout true
          echo "clang-r383902/" >> .git/info/sparse-checkout
          git pull --depth=1 origin main

      - name: Inject ReSukiSU, Official Patches, and SuFS Safely
        run: |
          cd kernel_source
          git reset --hard
          git clean -fd

          # 1. دمج ReSukiSU الأساسي
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git resukisu_repo
          if [ -d "drivers" ]; then
            mkdir -p drivers/ksu
            cp -rf resukisu_repo/kernel/* drivers/ksu/
          fi

          # 2. إضافة تضمين KSU في init/Kconfig بشكل صحيح وآمن
          if [ -f "init/Kconfig" ]; then
            if ! grep -q "drivers/ksu/Kconfig" init/Kconfig; then
              sed -i '/endmenu/i source "drivers/ksu/Kconfig"' init/Kconfig || true
            fi
          fi

          # 3. سحب وتطبيق رقعة ReSukiSU لنواة 4.19 مع تجاهل التعارضات
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU_Patches.git patches_repo
          if [ -f "patches_repo/scope-minimized/kernel-4.19.patch" ]; then
            git apply --reject --whitespace=fix patches_repo/scope-minimized/kernel-4.19.patch || true
          fi

          # 4. دمج SuFS لنواة 4.19
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs_repo
          if [ -d "susfs_repo/kernel_patches" ]; then
            cp -f susfs_repo/kernel_patches/fs/* fs/ || true
            cp -f susfs_repo/kernel_patches/include/linux/* include/linux/ || true
            
            PATCH_FILE=$(find susfs_repo/kernel_patches -name "*.patch" | head -n 1)
            if [ -n "$PATCH_FILE" ]; then
              git apply --reject --whitespace=fix "$PATCH_FILE" || true
            fi
          fi

      - name: Clean MediaTek Kconfig Conflicts
        run: |
          cd kernel_source
          if [ -f "drivers/soc/mediatek/Kconfig" ]; then
            sed -i '/config MTK_CMDQ/,/tristate/d' drivers/soc/mediatek/Kconfig || true
          fi

      - name: Configure Defconfig for KSU and SuFS
        run: |
          cd kernel_source
          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*_defconfig" | head -n 1)
          if [ -n "$DEFCONFIG_FILE" ]; then
            echo "CONFIG_KSU=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_HAS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$DEFCONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_HAS_AUTO_ADD_SUS_KSU_DEFAULT_HOOK=y" >> "$DEFCONFIG_FILE"
          else
            echo "Error: Defconfig file not found!"
            exit 1
          fi

      - name: Compile Kernel
        run: |
          cd kernel_source
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/../toolchain/clang/host/linux-x86/clang-r383902/bin:$PATH
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*_defconfig" | head -n 1)
          DEFCONFIG_NAME=$(basename "$DEFCONFIG_FILE")
          make O=out $DEFCONFIG_NAME
          make O=out -j$(nproc)

      - name: Upload Built Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A04-Kernel-ReSukiSU-SuFS
          path: 'kernel_source/out/arch/arm64/boot/Image.gz-dtb'
