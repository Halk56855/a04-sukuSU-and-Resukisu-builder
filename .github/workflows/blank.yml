name: Build Samsung A04 Kernel with TragicHorizon & AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Samsung-Galaxy-G85-JDM/kernel_samsung_a05m
          ref: linux-4.19.y
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu git libssl-dev make python3 wget zip clang lld

      - name: Clone & Hook ReSukiSU Source
        run: |
          git clone https://github.com/rsuntk/resukisu-common.git drivers/resukisu || true
          # ربط التعريفات بنظام بناء النواة في حال عدم وجودها
          if ! grep -q "resukisu" drivers/Makefile; then
            echo "obj-y += resukisu/" >> drivers/Makefile
          fi

      - name: Set Custom Kernel Version & Localversion
        run: |
          # تعديل رقم الإصدار في Makefile الرئيسي
          sed -i 's/^VERSION =.*/VERSION = 4/' Makefile
          sed -i 's/^PATCHLEVEL =.*/PATCHLEVEL = 19/' Makefile
          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 325/' Makefile
          
          # ضبط LOCALVERSION بشكل آمن
          ./scripts/config --file arch/arm64/configs/rsuntk-a04_defconfig --set-str CONFIG_LOCALVERSION "-TragicHorizon-v3-r1"

      - name: Setup Kernel Config
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out rsuntk-a04_defconfig

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          make O=out -j$(nproc) Image.gz || make O=out -j$(nproc) Image

      - name: Pack Kernel with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          # نسخ Image.gz إن وجد، وإلا يتم استخدام Image
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi
          
          cd AnyKernel3
          sed -i 's/BLOCK=.*/BLOCK=auto;/' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel.sh
          zip -r9 ../AnyKernel3-TragicHorizon-A04.zip * -x .git* README.md *placeholder

      - name: Upload AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-TragicHorizon-v3-r1-A04
          path: AnyKernel3-TragicHorizon-A04.zip
