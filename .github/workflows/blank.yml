name: Build TragicHorizon v2 r4 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex bison build-essential libssl-dev libncurses5-dev libncursesw5-dev libelf-dev bc u-boot-tools zip unzip liblz4-tool python3

      - name: Clone Samsung Kernel Source (linux-4.19.y Branch)
        run: |
          git clone --depth=1 -b linux-4.19.y https://github.com/Samsung-Galaxy-G85-JDM/kernel_samsung_a05m.git kernel-source

      - name: Download Toolchain (AOSP Clang r416183b)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $GITHUB_WORKSPACE/clang-aosp

      - name: Integrate KernelSU-Next (Legacy Branch)
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Configure Defconfig & Custom Kernel Name
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          
          # البحث التلقائي عن أول ملف defconfig متوفر للجهاز
          CONFIG_FILE=$(find arch/arm64/configs/ -name "*a04*" -o -name "*a05*" | head -n 1)
          if [ -z "$CONFIG_FILE" ]; then
            CONFIG_FILE="arch/arm64/configs/a04m_defconfig"
          fi
          
          echo "Using defconfig file: $CONFIG_FILE"
          
          # إضافة تسمية النواة المخصصة TragicHorizon v2 r4
          echo 'CONFIG_LOCALVERSION="-TragicHorizon-v2-r4"' >> $CONFIG_FILE
          
          # تفعيل KernelSU-Next وتعطيل Kprobes لتفادي Bootloop
          echo "CONFIG_KERNELSU=y" >> $CONFIG_FILE
          echo "CONFIG_KERNELSU_NEXT=y" >> $CONFIG_FILE
          echo "# CONFIG_KERNELSU_NEXT_KPROBES is not set" >> $CONFIG_FILE
          echo "# CONFIG_KPROBES is not set" >> $CONFIG_FILE

          # حفظ اسم الملف للاستخدام في خطوة البناء
          echo "DEFCONFIG_NAME=$(basename $CONFIG_FILE)" >> $GITHUB_ENV

      - name: Build Kernel Image
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          export PATH="$GITHUB_WORKSPACE/clang-aosp/clang-r416183b/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang

          # استخدام ملف الdefconfig المكتشف تلقائياً
          make O=out ${{ env.DEFCONFIG_NAME }}
          make -j$(nproc) O=out

      - name: Pack with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cd AnyKernel3
          
          # نسخ ملف النواة الناتج
          if [ -f ../kernel-source/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.gz .
          elif [ -f ../kernel-source/out/arch/arm64/boot/Image ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image .
          fi

          zip -r9 ../TragicHorizon-v2-r4-Kernel.zip * -x .git README.md

      - name: Upload Kernel ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TragicHorizon-v2-r4-Kernel
          path: TragicHorizon-v2-r4-Kernel.zip
