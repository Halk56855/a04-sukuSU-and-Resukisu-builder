name: Patch Boot Image with SukiSU-Ultra

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download boot.img from Release
        run: |
          # تحميل ملف boot.img من مستودع Boot-a04
          curl -L https://github.com/Halk56855/Boot-a04/releases/latest/download/boot.img -O
          ls -lh boot.img

      - name: Clone Magiskboot and Unpack
        run: |
          # سحب أداة magiskboot من مستودعك الخاص
          git clone https://github.com/Halk56855/Magiskboot.git magiskboot_repo
          cp magiskboot_repo/magiskboot ./magiskboot
          chmod +x magiskboot
          
          # فك ملف boot.img لاستخراج نواة kernel الخام
          ./magiskboot unpack boot.img
          ls -la

      - name: Verify Kernel Image
        run: |
          # التحقق من وجود ملف النواة المستخرج
          ls -la kernel

      - name: Package with AnyKernel3
        run: |
          # استنساخ حزمة التثبيت AnyKernel3
          git clone https://github.com/DaniTheSillyFem/AnyKernel3-a04.git AnyKernel3
          
          # نقل النواة المستخرجة إلى مجلد الحزمة باسم Image
          cp kernel AnyKernel3/Image
          
          # ضغط الحزمة بصيغة ZIP جاهزة للتفليش
          cd AnyKernel3
          zip -r ../SukiSU-Ultra-A04-Boot-Final.zip *

      - name: Upload Flashable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Galaxy-A04-Flashable
          path: SukiSU-Ultra-A04-Boot-Final.zip
