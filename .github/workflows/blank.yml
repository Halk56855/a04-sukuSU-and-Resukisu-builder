name: Build Samsung A04 Kernel with ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Samsung-Galaxy-G85-JDM/kernel_samsung_a05m
          ref: linux-4.19.y
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu git libssl-dev make python3 wget zip clang lld

      - name: Clone ReSukiSU Source
        run: |
          git clone https://github.com/rsuntk/resukisu-common.git drivers/resukisu || true

      - name: Setup Kernel Config & Integrate Hooks
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out rsuntk-a04_defconfig

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          make O=out -j$(nproc)

      - name: Upload Built Image (boot.img / Image)
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A04-ReSukiSU-Boot
          path: out/arch/arm64/boot/Image
